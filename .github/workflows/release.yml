            "$TIMEOUT_BIN" --kill-after=5s "${limit}s" "$GH_BIN" "$@"
          }
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          SOURCE_SHA=$(git rev-parse HEAD)
