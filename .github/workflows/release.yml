              if [ "$(printf '%s' "$NPM_POST_STATE" | jq -r '.exists')" = "true" ]; then
                NPM_IDENTITY_STATE=$(printf '%s' "$NPM_POST_STATE" | jq -c \
                  --arg channelVersion "$EXPECTED_CHANNEL_VERSION" '.channelVersion = $channelVersion')
