name: Publish API docs

# v3.6.0-rc.4 — auto-publish the TypeDoc-generated API reference from
# src/tools/* + src/tool-manifest.ts (TSDoc added in rc.3) to GitHub
# Pages on every push to main. The generated site lives at
# https://oomkapwn.github.io/enquire-mcp/ and is regenerated from the
# latest source on every merge — never hand-committed.

on:
  push:
    branches: [main]
  # Allow manual re-deploys (e.g. if Pages config changes) without a
  # source commit. Useful when toggling GH Pages on for the first time.
  workflow_dispatch:

# Minimum permissions for the deploy-pages action. `contents: read` to
# checkout, `pages: write` to publish, `id-token: write` to mint the
# OIDC token deploy-pages exchanges for an upload URL.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time, but don't cancel an in-flight deploy
# (an aborted upload would leave the site in a partial state).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      # v3.7.19 round-21 θ3 — lint + build before docs:api. Pre-3.7.19
      # publish-docs.yml ran ONLY `npm run docs:api` — if TypeDoc emitted
      # warnings or generation silently failed, the workflow still
      # uploaded whatever `docs/api-reference` contained (possibly empty
      # or stale from the last build). PR CI's `docs` job (added v3.7.6
      # M-5) already gates this on PR — but the publish workflow ran
      # separately on push-to-main and had no equivalent gate. Adding
      # lint+build ensures the publish path is at least as strict as PR.
      - run: npm run lint
      - run: npm run build
      - run: npm run docs:api
      # v3.8.0-rc.12 — also serve llms.txt from GH Pages so AI agents
      # (ChatGPT browsing, Perplexity, Claude.ai web fetches) discover
      # the project via the https://llmstxt.org/ standard. Copied from
      # the repo root into the upload artifact dir so it's served at
      # https://oomkapwn.github.io/enquire-mcp/llms.txt
      - run: cp llms.txt docs/api-reference/llms.txt
      # v3.8.6 — inject Schema.org JSON-LD into the API ref index.html so
      # Google AI Overviews / Perplexity / Bing Copilot recognize enquire-mcp
      # as a SoftwareApplication with structured metadata. Reads package.json
      # for canonical name/version/desc; idempotent (skips if already injected).
      - run: node scripts/inject-jsonld.mjs docs/api-reference/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/api-reference

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
