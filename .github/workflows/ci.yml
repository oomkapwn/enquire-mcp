name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      - run: npm run lint

  test:
    name: test (${{ matrix.label }})
    # Required gate. Runs on Linux to keep check-run names stable for the
    # branch protection ruleset.
    # v3.5.11 — dropped Node 20 from matrix. pdfjs-dist v5.7+ requires
    # `engines: >=22.13.0` and silently skips on Node 20 (it's an
    # optionalDep), which makes `tsc` fail in the `prepare` hook because
    # static `typeof import("pdfjs-dist")` types can't resolve. Node 20
    # is EOL as of 2026-04, so dropping CI testing on it matches reality.
    # End users on Node 20 still get the prebuilt `dist/` from npm and
    # the PDF feature degrades to "not available" (consistent with how
    # other optional native deps behave).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NPM_CONFIG_ENGINE_STRICT: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          # v3.12.0-rc.22 — exercise the literal public floor, not the latest
          # floating Node 22.x. Keep the label stable because branch protection
          # and the release workflow require the exact `test (22)` context.
          - label: "22"
            node-version: "22.13.0"
            floor: true
          - label: "24"
            node-version: "24"
            floor: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Assert exact declared Node floor
        if: matrix.floor
        run: |
          node -e '
            const declared = require("./package.json").engines?.node;
            const expected = `>=${process.versions.node}`;
            if (declared !== expected) {
              throw new Error(`engines.node=${declared}; exact CI floor=${expected}`);
            }
          '
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      - run: npm run build
      - name: Probe native SQLite and FTS5 at declared floor
        if: matrix.floor
        run: |
          node --input-type=module -e '
            import Database from "better-sqlite3";
            const db = new Database(":memory:");
            try {
              db.exec("CREATE VIRTUAL TABLE notes USING fts5(body)");
              db.prepare("INSERT INTO notes(body) VALUES (?)").run("exact floor probe");
              const row = db.prepare("SELECT body FROM notes WHERE notes MATCH ?").get("floor");
              if (row?.body !== "exact floor probe") {
                throw new Error("SQLite FTS5 floor probe returned the wrong row");
              }
            } finally {
              db.close();
            }
          '
      - run: npm test
        env:
          # v3.7.13 L4 — feed the GH token to `tests/github-metadata-invariant.test.ts`
          # so it actually runs `gh api` against the live repo instead of
          # silently no-op'ing. `gh` reads GH_TOKEN before GITHUB_TOKEN; the
          # built-in actions token has `metadata: read` for the workflow's
          # repo, which is exactly what the invariant needs (no escalated
          # permissions required — read-only About/Topics fetch).
          GH_TOKEN: ${{ github.token }}

  test-windows:
    name: test-windows
    # v3.12.0-rc.23 — a real, pinned Windows filesystem lane. The repository's
    # existing lifecycle scripts are deliberately exercised through Git Bash;
    # this is a hostile-filesystem contract, not a cmd.exe compatibility claim.
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      NPM_CONFIG_ENGINE_STRICT: "true"
      NPM_CONFIG_SCRIPT_SHELL: 'C:\Program Files\Git\bin\bash.exe'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Assert real case-insensitive Windows filesystem
        run: |
          node --input-type=module -e '
            import { existsSync, mkdtempSync, rmSync, writeFileSync } from "node:fs";
            import { tmpdir } from "node:os";
            import { join } from "node:path";
            if (process.platform !== "win32") {
              throw new Error(`expected win32, received ${process.platform}`);
            }
            const dir = mkdtempSync(join(tmpdir(), "enquire-win-probe-"));
            try {
              writeFileSync(join(dir, "CaseProbe.md"), "probe");
              if (!existsSync(join(dir, "caseprobe.md"))) {
                throw new Error("Windows filesystem probe is not case-insensitive");
              }
            } finally {
              rmSync(dir, { recursive: true, force: true });
            }
          '
      - name: Install deps (npm ci with retry)
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed; retrying in 15s"
            sleep 15
          done
      - run: npm run build
      - name: Probe native SQLite and FTS5 on Windows
        run: |
          node --input-type=module -e '
            import Database from "better-sqlite3";
            const db = new Database(":memory:");
            try {
              db.exec("CREATE VIRTUAL TABLE notes USING fts5(body)");
              db.prepare("INSERT INTO notes(body) VALUES (?)").run("windows probe");
              const row = db.prepare("SELECT body FROM notes WHERE notes MATCH ?").get("windows");
              if (row?.body !== "windows probe") {
                throw new Error("Windows SQLite FTS5 probe returned the wrong row");
              }
            } finally {
              db.close();
            }
          '
      - run: npm test -- tests/windows-path-safety.test.ts

  test-macos:
    # v2.0.0-beta.3: cross-platform advisory job (not required by branch
    # protection, doesn't block merges). Catches macOS-specific path /
    # symlink / chmod regressions on Apple silicon. The user dogfoods on
    # macOS arm64 — bugs that only show up there used to ship until manual
    # smoke caught them.
    runs-on: macos-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      - run: npm run build
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    # v3.11.0-rc.9 (audit I-COV-1 re-verify) — parity with the `test` job (10m). This
    # job does strictly MORE (npm ci + retry backoff + build + V8-INSTRUMENTED
    # test:coverage + changelog/per-file gates), so a 5m budget was a latent
    # flake-blocks-release risk (the rc.7/rc.20 class) on a slow/contended runner.
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      # v3.9.0-rc.26 (rc.25-audit LOW-2) — explicit build (matches the `test`
      # job). Previously dist/ existed only via the `npm ci` `prepare` hook; if
      # that hook ever changed (or `--ignore-scripts`), every distExists()-gated
      # test would silently no-op here and the per-file FLOORS would be measured
      # against a run where the CLI/E2E paths never executed. The cli.test.ts
      # CI-GUARD now also asserts dist is built — this makes that precondition
      # explicit rather than a side effect.
      - run: npm run build
      - run: npm run test:coverage
      # v3.5.12 — gate that CHANGELOG's claimed coverage stats match reality
      # within 0.5pp. Closes the class of bug v3.5.10 audit caught (inflated
      # stats copy-pasted from sub-agent output).
      - run: npm run check:changelog-coverage
      # v3.7.0 — per-file branch coverage floors for security-critical modules.
      # Global threshold (74%) alone hides per-file dips into the 66-68% range
      # (http-transport.ts, tools/search.ts, tools/meta.ts, tools/media.ts).
      # Floors set ~2pp below current values; updates require CHANGELOG note.
      - run: npm run check:per-file-coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  # v3.7.6 M-5 (external audit) — TypeDoc generation gate. README claims
  # "drift-free API reference auto-generated from source TSDoc on every push",
  # but pre-fix `npm run docs:api` was only run by the publish-docs workflow
  # on push-to-main, NOT on PR. A PR could land with broken @link references
  # or other TypeDoc warnings, and the drift only surfaced AFTER merge.
  # Now: PR CI verifies docs:api runs cleanly + emits no warnings.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      - run: npm run build
      # The SVG carries exact proof counts used in the README/social card.
      # Regenerate the committed PNG remotely and fail on byte drift so the
      # binary asset cannot silently lag its reviewable source.
      - id: preview_render
        run: npm run render:preview
      - name: Require committed social-preview bytes
        id: preview_diff
        run: git diff --exit-code -- assets/social-preview.png
      # Temporary retrieval path for the first rc.23 candidate run. The final
      # candidate removes this upload after committing the remote-rendered PNG.
      - name: Upload regenerated social preview on drift
        if: ${{ failure() && steps.preview_render.outcome == 'success' && steps.preview_diff.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: social-preview-render-${{ github.sha }}
          path: assets/social-preview.png
          if-no-files-found: error
          retention-days: 1
      # TypeDoc warnings on PR — treat as failure so doc drift fails CI,
      # not silently lands on main. The shell pipe captures the output and
      # greps for the "Found N warnings" / "Found N errors" lines.
      - name: TypeDoc generation (warnings = CI failure)
        run: |
          set -o pipefail
          npm run docs:api 2>&1 | tee /tmp/typedoc.log
          if grep -E "^\\[(warning|error)\\]|Found [1-9][0-9]* warning|Found [1-9][0-9]* error" /tmp/typedoc.log; then
            echo "::error::TypeDoc emitted warnings or errors — fix them before merge"
            exit 1
          fi
      # The Pages root is a human/AI landing page while the generated reference
      # remains available at /api/ and every historical symbol URL. Build and
      # validate that composite artifact on PRs, not only after merge.
      - run: npm run docs:pages

  # v3.7.19 (round-21 self-audit θ1) — Outside-In Audit job.
  # The OIA script (added v3.7.17) catches "state-driven" drift that
  # internal change-driven sweeps miss (stale CLI subcommands in docs,
  # version-drifted file headers, shell-script staleness, etc.).
  #
  # v3.7.19: added as ADVISORY (continue-on-error=true) for one release
  # cycle of production observation. v3.8.0-rc.6 (round-23 audit response):
  # promoted to REQUIRED — one full release cycle confirmed zero false
  # positives. Also added to the release.yml REQUIRED gate list (9 total).
  oia:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      # OIA doesn't need a build — it greps source + docs. Skip `npm run build`.
      - run: npm run check:oia

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Keep the protected/release-required `smoke` context name stable while
    # making the Windows filesystem lane a real blocking prerequisite.
    needs: [test, test-windows]
    if: ${{ always() }}
    env:
      NPM_CONFIG_ENGINE_STRICT: "true"
    steps:
      - name: Require Linux and Windows test prerequisites
        env:
          LINUX_TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_TEST_RESULT: ${{ needs['test-windows'].result }}
        run: |
          if [ "$LINUX_TEST_RESULT" != "success" ] || [ "$WINDOWS_TEST_RESULT" != "success" ]; then
            echo "::error::test=$LINUX_TEST_RESULT test-windows=$WINDOWS_TEST_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # v3.12.0-rc.22 — run the MCP/FTS smoke at the literal public floor.
          node-version: "22.13.0"
          cache: npm
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      - run: npm run build
      - name: Build synthetic vault
        id: vault
        run: echo "path=$(node scripts/synthetic-vault.mjs)" >> "$GITHUB_OUTPUT"
      - name: JSON-RPC smoke test (scan path)
        run: node scripts/smoke.mjs "${{ steps.vault.outputs.path }}"
      - name: JSON-RPC smoke test (FTS5 --persistent-index path)
        run: node scripts/smoke.mjs "${{ steps.vault.outputs.path }}" --with-fts

  audit:
    # v2.0.0-beta.3: elevate from --audit-level=high to moderate for prod
    # deps. Pre-fix, the ip-address moderate XSS advisory sat undetected
    # between Dependabot scans because audit didn't gate on it. Production
    # transitive deps are usually safe, but elevating closes that gap.
    # Dev deps stay at high (test/build tooling, less surface, more noise).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # v3.5.11 — bumped from 20 → 22 because pdfjs v5+ requires it.
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      # v3.11.7-rc.8 — audit both this root lockfile and the dependency graph a registry
      # consumer resolves without our root-only overrides. Scope-specific exceptions must
      # carry a rationale + removal tracker; new or stale advisories fail closed.
      - name: Audit source and published-consumer dependency graphs
        run: npm run check:audit

  version-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: node scripts/check-version-consistency.mjs

  # v3.10.0-rc.27 — Docker image build + MCP introspection smoke. MCP directories
  # (Glama → awesome-mcp-servers) build the Dockerfile and call tools/list over
  # stdio; this job verifies the image BUILDS and ANSWERS, so the
  # "Glama-introspectable" claim is ENFORCED (anti-overclaim), not aspirational,
  # and the Dockerfile is guarded against rot. Advisory — NOT in the
  # branch-protection required set, so it never blocks a merge. Uses only the
  # already-SHA-pinned checkout action + `docker` (preinstalled on the runner):
  # no new action to SHA-pin, and no `npm ci` (the build runs npm INSIDE the
  # image), so OIA Checks 9/10 don't apply.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the introspection image
        run: docker build -t enquire-mcp:ci .
      - name: CLI smoke — the bin runs inside the image
        # here-string `grep <<<` avoids the `grep -q` early-close EPIPE that, under
        # the runner's `bash -e`, would abort the step even on a successful match.
        run: |
          out=$(timeout 60 docker run --rm enquire-mcp:ci --help || true)
          grep -qi 'serve' <<<"$out" || { echo "::error::--help did not list the serve subcommand"; printf '%s\n' "$out" | tail -c 600; exit 1; }
          echo "OK — bin runs in image; --help lists serve"
      - name: MCP tools/list smoke — stdio introspection (what Glama does)
        run: |
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout 90 docker run --rm -i enquire-mcp:ci || true)
          grep -q '"obsidian_search"' <<<"$out" || { echo "::error::tools/list did not return obsidian_search from the container"; printf '%s\n' "$out" | tail -c 1000; exit 1; }
          echo "OK — tools/list returned obsidian_search over stdio"
