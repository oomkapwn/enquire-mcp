             [ ! -f "$NPM_GLOBALCONFIG" ] || [ -L "$NPM_GLOBALCONFIG" ] || \
             [ "$NPM_USERCONFIG" = "$NPM_GLOBALCONFIG" ]; then
            echo "::error::npm verifier config files are missing, aliased, or unsafe"
            exit 1
          fi
          CLEAN_NPM_ENV=(
            "${CLEAN_ENV[@]}"
            "NPM_CONFIG_CACHE=$VERIFY_CACHE"
            "NPM_CONFIG_CAFILE="
            "NPM_CONFIG_CA="
            "NPM_CONFIG_COLOR=false"
            "NPM_CONFIG_FETCH_RETRIES=0"
            "NPM_CONFIG_FETCH_TIMEOUT=60000"
            "NPM_CONFIG_FUND=false"
            "NPM_CONFIG_GLOBALCONFIG=$NPM_GLOBALCONFIG"
            "NPM_CONFIG_HTTPS_PROXY="
            "NPM_CONFIG_IGNORE_SCRIPTS=true"
            "NPM_CONFIG_OMIT=optional"
            "NPM_CONFIG_PREFER_ONLINE=true"
            "NPM_CONFIG_PROXY="
            "NPM_CONFIG_REGISTRY=https://registry.npmjs.org/"
            "NPM_CONFIG_STRICT_SSL=true"
            "NPM_CONFIG_USERCONFIG=$NPM_USERCONFIG"
          )

          set +e
          NPM_CLI_HTTP_STATUS=$(/usr/bin/env -i "${CLEAN_ENV[@]}" \
            "$TIMEOUT_BIN" --kill-after=10s 120s "$CURL_BIN" --disable --proxy '' \
              --silent --show-error --connect-timeout 15 --max-time 100 --max-filesize 4194304 --retry 0 \
              --proto '=https' --tlsv1.2 --header "Accept: application/octet-stream" \
              --output "$NPM_CLI_TARBALL" --write-out '%{http_code}' "$NPM_CLI_URL")
          NPM_CLI_DOWNLOAD_EXIT=$?
          set -e
          if [ "$NPM_CLI_DOWNLOAD_EXIT" -ne 0 ] || [ "$NPM_CLI_HTTP_STATUS" != "200" ] || \
             [ ! -f "$NPM_CLI_TARBALL" ] || [ -L "$NPM_CLI_TARBALL" ]; then
            echo "::error::exact pinned npm CLI download failed closed"
            exit 1
          fi
          NPM_CLI_ACTUAL_SIZE=$(/usr/bin/env -i "${CLEAN_ENV[@]}" "$STAT_BIN" -c '%s' "$NPM_CLI_TARBALL")
          if [ "$NPM_CLI_ACTUAL_SIZE" != "$NPM_CLI_SIZE" ]; then
            echo "::error::exact pinned npm CLI size differs from the registry identity"
            exit 1
          fi
          NPM_CLI_ACTUAL_SRI=$(/usr/bin/env -i "${CLEAN_ENV[@]}" \
            "$TIMEOUT_BIN" --kill-after=5s 30s "$NODE_BIN" -e '
              const { createHash } = require("node:crypto");
              const { readFileSync } = require("node:fs");
              process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`);
            ' "$NPM_CLI_TARBALL")
          if [ "$NPM_CLI_ACTUAL_SRI" != "$NPM_CLI_SRI" ]; then
            echo "::error::exact pinned npm CLI SRI differs from the registry identity"
            exit 1
          fi
          if ! NPM_CLI_MEMBERS=$(/usr/bin/env -i "${CLEAN_ENV[@]}" \
            "$TIMEOUT_BIN" --kill-after=5s 30s "$TAR_BIN" --list --gzip \
              --absolute-names --quoting-style=escape --file "$NPM_CLI_TARBALL"); then
            echo "::error::exact pinned npm CLI member-path inventory failed closed"
            exit 1
          fi
          if ! printf '%s\n' "$NPM_CLI_MEMBERS" | /usr/bin/env -i "${CLEAN_ENV[@]}" "$AWK_BIN" '
            NF == 0 || $0 !~ /^package\// || $0 ~ /(^|\/)\.\.?(\/|$)/ ||
              $0 ~ /^\// || $0 ~ /\/\// || $0 ~ /\\/ || seen[$0]++ { invalid = 1 }
            END { exit NR == 0 || invalid }
          '; then
            echo "::error::exact pinned npm CLI archive has an absolute, escaping, or non-package member path"
            exit 1
          fi
          if ! NPM_CLI_MEMBER_TYPES=$(/usr/bin/env -i "${CLEAN_ENV[@]}" \
            "$TIMEOUT_BIN" --kill-after=5s 30s "$TAR_BIN" --list --verbose --gzip \
              --absolute-names --numeric-owner --quoting-style=escape --file "$NPM_CLI_TARBALL"); then
            echo "::error::exact pinned npm CLI member-type inventory failed closed"
            exit 1
          fi
          if ! printf '%s\n' "$NPM_CLI_MEMBER_TYPES" | /usr/bin/env -i "${CLEAN_ENV[@]}" "$AWK_BIN" '
            NF == 0 || (substr($0, 1, 1) != "-" && substr($0, 1, 1) != "d") { invalid = 1 }
            END { exit NR == 0 || invalid }
          '; then
            echo "::error::exact pinned npm CLI archive contains a link, device, FIFO, or non-file member"
            exit 1
          fi
          /usr/bin/env -i "${CLEAN_ENV[@]}" "$TIMEOUT_BIN" --kill-after=5s 30s \
            "$TAR_BIN" --extract --gzip --file "$NPM_CLI_TARBALL" --directory "$NPM_CLI_ROOT" \
              --no-same-owner --no-same-permissions
          NPM_CLI_JS="$NPM_CLI_ROOT/package/bin/npm-cli.js"
          NPM_CLI_PACKAGE="$NPM_CLI_ROOT/package/package.json"
          if [ ! -f "$NPM_CLI_JS" ] || [ -L "$NPM_CLI_JS" ] || \
             [ ! -f "$NPM_CLI_PACKAGE" ] || [ -L "$NPM_CLI_PACKAGE" ]; then
            echo "::error::exact pinned npm CLI archive has an invalid executable identity"
            exit 1
          fi
          ACTUAL_NPM_CLI_VERSION=$(/usr/bin/env -i "${CLEAN_ENV[@]}" "$NODE_BIN" \
            -e 'process.stdout.write(require(process.argv[1]).version)' "$NPM_CLI_PACKAGE")
          if [ "$ACTUAL_NPM_CLI_VERSION" != "$NPM_CLI_VERSION" ]; then
            echo "::error::exact pinned npm CLI embeds a divergent version"
            exit 1
          fi

          printf '%s\n' '{"name":"enquire-provenance-verifier","version":"0.0.0","private":true}' \
            > "$CONSUMER_ROOT/package.json"
          CHECKER="$GITHUB_WORKSPACE/scripts/check-release-integrity.mjs"
          if [ ! -f "$CHECKER" ] || [ -L "$CHECKER" ]; then
            echo "::error::npm provenance evaluator is missing, non-regular, or a symlink"
            exit 1
          fi
          (
            cd "$CONSUMER_ROOT"
            /usr/bin/env -i "${CLEAN_NPM_ENV[@]}" \
              "$TIMEOUT_BIN" --kill-after=10s 600s "$NODE_BIN" "$NPM_CLI_JS" install \
                --save-exact --package-lock=true --ignore-scripts --no-audit --no-fund --omit=optional \
                --registry=https://registry.npmjs.org/ --fetch-retries=0 --fetch-timeout=60000 \
                "$PACKAGE_NAME@$EXPECTED_VERSION"
          )
          /usr/bin/env -i "${CLEAN_ENV[@]}" "$JQ_BIN" -e \
            --arg package "$PACKAGE_NAME" --arg version "$EXPECTED_VERSION" --arg integrity "$EXPECTED_INTEGRITY" '
              .lockfileVersion == 3 and
              .packages[""].dependencies[$package] == $version and
              .packages["node_modules/@oomkapwn/enquire-mcp"].version == $version and
              .packages["node_modules/@oomkapwn/enquire-mcp"].integrity == $integrity
            ' "$CONSUMER_ROOT/package-lock.json" >/dev/null

          PROVENANCE_VERIFIED=false
          PROVENANCE_RESULT=""
          for (( attempt=1; attempt<=8; attempt++ )); do
            set +e
            (
              cd "$CONSUMER_ROOT"
              /usr/bin/env -i "${CLEAN_NPM_ENV[@]}" \
                "$TIMEOUT_BIN" --kill-after=10s 120s "$NODE_BIN" "$NPM_CLI_JS" audit signatures \
                  --json --include-attestations --omit=optional --registry=https://registry.npmjs.org/ \
                  --fetch-retries=0 --fetch-timeout=60000 --prefer-online
            ) > "$AUDIT_JSON"
            AUDIT_EXIT=$?
            PROVENANCE_RESULT=""
            PROVENANCE_RESULT=$(/usr/bin/env -i "${CLEAN_ENV[@]}" \
              "$TIMEOUT_BIN" --kill-after=5s 30s "$NODE_BIN" "$CHECKER" \
                npm-provenance "$PACKAGE_NAME" "$EXPECTED_VERSION" \
                "$EXPECTED_INTEGRITY" "$EXPECTED_SOURCE_SHA" "$EXPECTED_TAG" "$PUBLISH_ATTEMPTED" \
                "$CURRENT_RUN_ID" "$CURRENT_RUN_ATTEMPT" < "$AUDIT_JSON")
            EVALUATOR_EXIT=$?
            set -e
            if [ "$AUDIT_EXIT" -eq 0 ] && [ "$EVALUATOR_EXIT" -eq 0 ]; then
              PROVENANCE_VERIFIED=true
              break
            fi
            if [ "$attempt" -lt 8 ]; then
              echo "::warning::npm attestations are not yet exact (attempt $attempt/8); retrying read-only verification"
              /bin/sleep 10
            fi
          done
          if [ "$PROVENANCE_VERIFIED" != "true" ]; then
            echo "::error::npm provenance did not converge to one exact cryptographically verified identity"
            exit 1
          fi
          ATTESTATION_RUN_ID=$(printf '%s' "$PROVENANCE_RESULT" | \
            /usr/bin/env -i "${CLEAN_ENV[@]}" "$JQ_BIN" -er '.runId | select(type == "string" and test("^[1-9][0-9]*$"))')
          ATTESTATION_RUN_ATTEMPT=$(printf '%s' "$PROVENANCE_RESULT" | \
            /usr/bin/env -i "${CLEAN_ENV[@]}" "$JQ_BIN" -er '.runAttempt | select(type == "string" and test("^[1-9][0-9]*$"))')
          {
            printf 'verified=true\n'
            printf 'run_id=%s\n' "$ATTESTATION_RUN_ID"
            printf 'run_attempt=%s\n' "$ATTESTATION_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
      # v3.7.14 F5 — automate the GitHub Release (M13 from round-15 audit).
      # Pre-3.7.14 the README claimed "npm + GitHub release per tag" but
      # gh release create was a manual post-release step (CONTRIBUTING.md:87).
      # Stable releases (latest dist-tag) get marked as Latest; prereleases
      # (rc / alpha / beta etc.) get marked as prereleases. Notes are extracted
      # from CHANGELOG.md for the just-published version — the per-section
      # `## [X.Y.Z] — YYYY-MM-DD` heading is the canonical entry boundary.
      # A retry may reuse an existing release only after validating its tag,
      # remote annotated-tag source, channel, and draft/published identity.
      - name: Prepare draft GitHub Release
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          LD_DEBUG_OUTPUT: ""
          LD_PROFILE: ""
          GLIBC_TUNABLES: ""
          TAR_OPTIONS: ""
          OPENSSL_CONF: ""
          NODE_DEBUG: ""
          GODEBUG: ""
          NODE_TLS_REJECT_UNAUTHORIZED: "1"
          GH_HOST: github.com
          GH_HTTP_UNIX_SOCKET: ""
          HTTPS_PROXY: ""
          HTTP_PROXY: ""
          ALL_PROXY: ""
          CURL_CA_BUNDLE: ""
          SSL_CERT_FILE: ""
          SSL_CERT_DIR: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_JOB_DEADLINE_EPOCH: ${{ steps.deadline.outputs.epoch }}
        run: |
          set -euo pipefail
          builtin unset -v https_proxy http_proxy all_proxy
          GH_CONFIG_DIR=$(/usr/bin/mktemp -d "$RUNNER_TEMP/enquire-gh-config.XXXXXX")
          export GH_CONFIG_DIR
          GH_BIN=$(type -P gh)
          TIMEOUT_BIN=$(type -P timeout)
          gh_read() {
            if [ "${1:-}" != "api" ]; then
              echo "::error::gh_read accepts read-only gh api calls" >&2
              return 2
            fi
            local argument
            for argument in "$@"; do
              case "$argument" in
                graphql|--method|--method=*|-X*|--input|--input=*|-f*|-F*|--field|--field=*|--raw-field|--raw-field=*)
                  echo "::error::gh_read rejects mutation-capable gh api arguments" >&2
                  return 2
                  ;;
              esac
            done
            if ! [[ "${RELEASE_JOB_DEADLINE_EPOCH:-}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Global release deadline is missing or malformed" >&2
              return 2
            fi
            local now remaining
            if ! now=$(/bin/date +%s) || ! [[ "$now" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Current epoch is unavailable or malformed" >&2
              return 2
            fi
            remaining=$((RELEASE_JOB_DEADLINE_EPOCH - now))
            if [ "$remaining" -le 10 ]; then
              echo "::error::Global 230-minute release deadline reached during a GitHub read" >&2
              return 124
            fi
            local limit=20
            if [ "$limit" -gt $((remaining - 10)) ]; then limit=$((remaining - 10)); fi
            "$TIMEOUT_BIN" --kill-after=5s "${limit}s" "$GH_BIN" "$@"
          }
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          SOURCE_SHA=$(git rev-parse HEAD)
          EXPECTED_PRERELEASE=false
          if [ "${{ steps.dist_tag.outputs.tag }}" != "latest" ]; then
            EXPECTED_PRERELEASE=true
          fi
          ASSET="artifacts/enquire-mcp-basic-$VERSION.mcpb"
          CONTENT="artifacts/enquire-mcp-basic-$VERSION.content-manifest.json"
          SBOM="artifacts/enquire-mcp-basic-$VERSION.sbom.cdx.json"
          LICENSES="artifacts/enquire-mcp-basic-$VERSION.third-party-licenses.json"
          NOTES=$(awk -v heading="## [$VERSION] — " '
            index($0, heading) == 1 { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full release notes."
          fi
          release_state() {
            EXPECTED_RELEASE_NAME="$TAG" EXPECTED_RELEASE_BODY="$NOTES" \
              node scripts/check-release-integrity.mjs release-state "$TAG" "$EXPECTED_PRERELEASE" \
              "$(basename "$ASSET")" "$(basename "$ASSET.sha256")" "$(basename "$CONTENT")" \
              "$(basename "$SBOM")" "$(basename "$LICENSES")" "$(basename "$ASSET.provenance.json")"
          }
          assert_remote_tag_identity() {
            if ! TAG_REF_JSON=$(gh_read api \
              "repos/${{ github.repository }}/git/ref/tags/$TAG"); then
              echo "::error::Exact-repository tag ref $TAG is unreadable"
              exit 1
            fi
            if ! TAG_OBJECT_SHA=$(printf '%s' "$TAG_REF_JSON" | jq -er --arg ref "refs/tags/$TAG" \
              'select(type == "object" and .ref == $ref) | .object |
               select(type == "object" and .type == "tag") | .sha |
               select(type == "string" and test("^[0-9a-f]{40}$"))'); then
              echo "::error::Exact-repository ref $TAG is not one annotated-tag object"
              exit 1
            fi
            if ! TAG_OBJECT_JSON=$(gh_read api \
              "repos/${{ github.repository }}/git/tags/$TAG_OBJECT_SHA"); then
              echo "::error::Annotated-tag object $TAG_OBJECT_SHA is unreadable"
              exit 1
            fi
            if ! printf '%s' "$TAG_OBJECT_JSON" | jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" \
              --arg tag_object_sha "$TAG_OBJECT_SHA" \
              'select(type == "object" and .sha == $tag_object_sha and .tag == $tag) | .object |
               select(type == "object" and .type == "commit" and .sha == $sha)' >/dev/null; then
              echo "::error::Exact-repository tag $TAG must peel to exact source SHA $SOURCE_SHA"
              exit 1
            fi
            if ! TAG_REF_CONFIRM_JSON=$(gh_read api \
              "repos/${{ github.repository }}/git/ref/tags/$TAG") || \
               ! printf '%s' "$TAG_REF_CONFIRM_JSON" | jq -e --arg ref "refs/tags/$TAG" \
                 --arg sha "$TAG_OBJECT_SHA" \
                 'select(type == "object" and .ref == $ref) | .object |
                  select(type == "object" and .type == "tag" and .sha == $sha)' >/dev/null; then
              echo "::error::Exact-repository tag ref $TAG changed during identity proof"
              exit 1
            fi
          }
          assert_remote_tag_identity
          # A retry may reuse an existing release only when its channel and
          # externally verified annotated-tag source match this workflow.
          RELEASE_PAGES=$(gh_read api --paginate --slurp \
            "repos/${{ github.repository }}/releases?per_page=100")
          RELEASES=$(printf '%s' "$RELEASE_PAGES" | node scripts/check-release-integrity.mjs \
            flatten-pages release)
          RELEASE_COUNT=$(printf '%s' "$RELEASES" | jq --arg tag "$TAG" \
            '[.[] | select(.tag_name == $tag)] | length')
          if [ "$RELEASE_COUNT" -gt 1 ]; then
            echo "::error::GitHub returned duplicate draft/published releases for $TAG"
            exit 1
          fi
          if [ "$RELEASE_COUNT" -eq 1 ]; then
            RELEASE_JSON=$(printf '%s' "$RELEASES" | jq --arg tag "$TAG" \
              '.[] | select(.tag_name == $tag)')
            RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -er \
              '.id | select(type == "number" and . > 0 and floor == . and . <= 9007199254740991)')
            ASSET_PAGES=$(gh_read api --paginate --slurp \
              "repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100")
            REMOTE_ASSETS=$(printf '%s' "$ASSET_PAGES" | node scripts/check-release-integrity.mjs \
              flatten-pages asset)
            RELEASE_STATE=$(jq -n --argjson release "$RELEASE_JSON" --argjson assets "$REMOTE_ASSETS" \
              '{release: $release, assets: $assets}')
            RELEASE_ACTION=$(printf '%s' "$RELEASE_STATE" | release_state | jq -r '.action')
            ACTUAL_TAG=$(printf '%s' "$RELEASE_JSON" | jq -r '.tag_name')
            ACTUAL_PRERELEASE=$(printf '%s' "$RELEASE_JSON" | jq -r '.prerelease')
            ACTUAL_DRAFT=$(printf '%s' "$RELEASE_JSON" | jq -r '.draft')
            if [ "$ACTUAL_TAG" != "$TAG" ] || \
               [ "$ACTUAL_PRERELEASE" != "$EXPECTED_PRERELEASE" ] || \
               { [ "$ACTUAL_DRAFT" != "true" ] && [ "$ACTUAL_DRAFT" != "false" ]; }; then
              echo "::error::Existing release $TAG has incompatible tag, channel, or draft identity"
              exit 1
            fi
            if [ "$ACTUAL_DRAFT" = "false" ] && [ "${{ steps.dist_tag.outputs.tag }}" = "latest" ]; then
              LATEST_TAG=$(gh_read api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
              if [ "$LATEST_TAG" != "$TAG" ]; then
                echo "::error::Existing stable release $TAG is not GitHub's latest release"
                exit 1
              fi
            fi
            echo "Release $TAG already exists with the exact expected draft/published identity"
            exit 0
          fi
          RELEASE_ACTION=$(printf '%s' '{"release":null,"assets":[]}' | release_state | jq -r '.action')
          if [ "$RELEASE_ACTION" != "create_draft" ]; then exit 1; fi
          # Uploads happen while the release is a draft. Publication is a
          # separate postcondition after the exact asset set is complete.
          require_job_reserve() {
            local required="$1"
            local label="$2"
            if ! [[ "${RELEASE_JOB_DEADLINE_EPOCH:-}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Global release deadline is missing or malformed" >&2
              exit 1
            fi
            local now remaining
            if ! now=$(/bin/date +%s) || ! [[ "$now" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Current epoch is unavailable or malformed" >&2
              return 2
            fi
            remaining=$((RELEASE_JOB_DEADLINE_EPOCH - now))
            if [ "$remaining" -lt "$required" ]; then
              echo "::error::$label requires ${required}s of post-write reserve; only ${remaining}s remain"
              exit 1
            fi
          }
          CREATE_ARGS=(release create "$TAG" --repo "${{ github.repository }}" \
            --title "$TAG" --notes "$NOTES" --draft --verify-tag)
          if [ "${{ steps.dist_tag.outputs.tag }}" != "latest" ]; then
            CREATE_ARGS+=(--prerelease)
          fi
          require_job_reserve 3600 "GitHub draft creation"
          assert_remote_tag_identity
          CREATE_EXIT=0
          set +e
          "$TIMEOUT_BIN" --kill-after=10s 300s "$GH_BIN" "${CREATE_ARGS[@]}"
          CREATE_EXIT=$?
          set -e
          # Command exit is diagnostic only: after the single create attempt,
          # authoritative reads must prove one exact safe release state. This
          # also handles a lost response or delayed list visibility without a
          # second create in the same workflow run.
          for (( create_recovery_attempt=1; create_recovery_attempt<=12; create_recovery_attempt++ )); do
            if ! RECOVERY_PAGES=$(gh_read api --paginate --slurp \
              "repos/${{ github.repository }}/releases?per_page=100"); then
              if [ "$create_recovery_attempt" -eq 12 ]; then
                echo "::error::Draft create readback remained unreadable after 12 bounded checks; create exit=$CREATE_EXIT"
                exit 1
              fi
              sleep 5
              continue
            fi
            RECOVERY_RELEASES=$(printf '%s' "$RECOVERY_PAGES" | node scripts/check-release-integrity.mjs \
              flatten-pages release)
            RECOVERY_COUNT=$(printf '%s' "$RECOVERY_RELEASES" | jq --arg tag "$TAG" \
              '[.[] | select(.tag_name == $tag)] | length')
            if [ "$RECOVERY_COUNT" -gt 1 ]; then
              echo "::error::Draft create readback found duplicate releases for $TAG"
              exit 1
            fi
            if [ "$RECOVERY_COUNT" -eq 1 ]; then
              RECOVERY_RELEASE=$(printf '%s' "$RECOVERY_RELEASES" | jq --arg tag "$TAG" \
                '.[] | select(.tag_name == $tag)')
              if ! RECOVERY_ID=$(printf '%s' "$RECOVERY_RELEASE" | jq -er \
                '.id | select(type == "number" and . > 0 and floor == . and . <= 9007199254740991)') || \
                 ! RECOVERY_TAG=$(printf '%s' "$RECOVERY_RELEASE" | jq -er \
                   '.tag_name | select(type == "string" and length > 0)') || \
                 ! RECOVERY_PRERELEASE=$(printf '%s' "$RECOVERY_RELEASE" | jq -er \
                   '.prerelease | select(type == "boolean") | tostring') || \
                 ! RECOVERY_DRAFT=$(printf '%s' "$RECOVERY_RELEASE" | jq -er \
                   '.draft | select(type == "boolean") | tostring'); then
                if [ "$create_recovery_attempt" -eq 12 ]; then
                  echo "::error::Draft create readback remained malformed after 12 bounded checks"
                  exit 1
                fi
                sleep 5
                continue
              fi
              if [ "$RECOVERY_TAG" != "$TAG" ] || [ "$RECOVERY_PRERELEASE" != "$EXPECTED_PRERELEASE" ] || \
                 { [ "$RECOVERY_DRAFT" != "true" ] && [ "$RECOVERY_DRAFT" != "false" ]; }; then
                echo "::error::Draft create readback returned a divergent exact release identity"
                exit 1
              fi
              if ! RECOVERY_ASSET_PAGES=$(gh_read api --paginate --slurp \
                "repos/${{ github.repository }}/releases/$RECOVERY_ID/assets?per_page=100") || \
                 ! RECOVERY_ASSETS=$(printf '%s' "$RECOVERY_ASSET_PAGES" | node \
                   scripts/check-release-integrity.mjs flatten-pages asset); then
                if [ "$create_recovery_attempt" -eq 12 ]; then
                  echo "::error::Draft create asset readback remained unreadable after 12 bounded checks"
                  exit 1
                fi
                sleep 5
                continue
              fi
              RECOVERY_STATE=$(jq -n --argjson release "$RECOVERY_RELEASE" --argjson assets "$RECOVERY_ASSETS" \
                '{release: $release, assets: $assets}')
              RECOVERY_ACTION=$(printf '%s' "$RECOVERY_STATE" | release_state | jq -r '.action')
              if [ "$RECOVERY_ACTION" != "resume_draft" ] && [ "$RECOVERY_ACTION" != "publish_draft" ] && \
                 [ "$RECOVERY_ACTION" != "reuse_published" ]; then
                echo "::error::Draft create readback produced unsafe release action $RECOVERY_ACTION"
                exit 1
              fi
              assert_remote_tag_identity
              echo "Confirmed exact release $TAG after one draft-create attempt (exit=$CREATE_EXIT)"
              exit 0
            fi
            if [ "$create_recovery_attempt" -eq 12 ]; then
              echo "::error::Draft create did not become visible after 12 bounded checks; create exit=$CREATE_EXIT"
              exit 1
            fi
            echo "::warning::Draft $TAG is not visible yet (attempt $create_recovery_attempt/12); retrying in 5s"
            sleep 5
          done
      - name: Upload Basic MCPB asset, checksum, and provenance
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          LD_DEBUG_OUTPUT: ""
          LD_PROFILE: ""
          GLIBC_TUNABLES: ""
          TAR_OPTIONS: ""
          OPENSSL_CONF: ""
          NODE_DEBUG: ""
          GODEBUG: ""
          NODE_TLS_REJECT_UNAUTHORIZED: "1"
          GH_HOST: github.com
          GH_HTTP_UNIX_SOCKET: ""
          HTTPS_PROXY: ""
          HTTP_PROXY: ""
          ALL_PROXY: ""
          CURL_CA_BUNDLE: ""
          SSL_CERT_FILE: ""
          SSL_CERT_DIR: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_JOB_DEADLINE_EPOCH: ${{ steps.deadline.outputs.epoch }}
          MCPB_RELEASE_REPOSITORY: ${{ github.repository }}
          MCPB_RELEASE_CHANNEL: ${{ steps.dist_tag.outputs.tag }}
          MCPB_RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          builtin unset -v https_proxy http_proxy all_proxy
          RELEASE_TRANSACTION_PATH=".github/scripts/release-mcpb-github-transaction.sh"
          if ! [[ "${MCPB_RELEASE_WORKFLOW_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Workflow commit SHA is missing or malformed"
            exit 1
          fi
          if ! RELEASE_TRANSACTION_SNAPSHOT=$(
            /usr/bin/env -i \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_CONFIG_SYSTEM=/dev/null \
              GIT_CONFIG_GLOBAL=/dev/null \
              GIT_CONFIG_COUNT=0 \
              GIT_NO_LAZY_FETCH=1 \
              GIT_NO_REPLACE_OBJECTS=1 \
              GIT_OPTIONAL_LOCKS=0 \
              GIT_TERMINAL_PROMPT=0 \
              /usr/bin/git --no-pager --no-replace-objects \
              --git-dir="$GITHUB_WORKSPACE/.git" \
              cat-file blob "$MCPB_RELEASE_WORKFLOW_SHA:$RELEASE_TRANSACTION_PATH"
          ); then
            echo "::error::GitHub Release transaction script could not be read from the workflow commit"
            exit 1
          fi
          RELEASE_TRANSACTION_SHA256="3f9f96ddf9ddd7c273c97a9ad4a03898d1b0ae1590940770c0185ed432d10469"
          if ! RELEASE_TRANSACTION_ACTUAL_SHA256=$(
            builtin printf '%s' "$RELEASE_TRANSACTION_SNAPSHOT" | /usr/bin/sha256sum
          ); then
            echo "::error::GitHub Release transaction snapshot could not be hashed"
            exit 1
          fi
          RELEASE_TRANSACTION_ACTUAL_SHA256=${RELEASE_TRANSACTION_ACTUAL_SHA256%% *}
          if ! [[ "$RELEASE_TRANSACTION_ACTUAL_SHA256" =~ ^[0-9a-f]{64}$ ]] ||
             [ "$RELEASE_TRANSACTION_ACTUAL_SHA256" != "$RELEASE_TRANSACTION_SHA256" ]; then
            echo "::error::GitHub Release transaction script differs from the reviewed workflow identity"
            exit 1
          fi
          builtin printf '%s\n' "$RELEASE_TRANSACTION_SNAPSHOT" |
            /bin/bash --noprofile --norc -p -e -o pipefail -s --
      # v3.9.0-rc.32 — automate the official MCP Registry publish via GitHub
      # Actions OIDC (no interactive login, no dedicated secret — `id-token:
      # write` above is the only requirement; the registry trusts the repo's
      # OIDC identity for the `io.github.oomkapwn/*` namespace).
      #
      # STABLE-ONLY: the registry's `isLatest` should reflect what users get
      # from `npm install @oomkapwn/enquire-mcp` (the `latest` dist-tag), NOT a
      # prerelease — otherwise the canonical listing (which Glama / mcp.so /
      # smithery auto-sync from) would advertise an `-rc.N` as current. RC tags
      # publish to npm under `@rc` but are SKIPPED here. This closes the
      # registry-drift class: pre-3.9.0-rc.32 the registry was published
      # manually (`mcp-publisher publish` after each stable), and it silently
      # fell ~7 versions behind (stuck at 3.8.4 while npm was at 3.8.8).
      - name: Publish to MCP Registry (stable only)
        if: steps.dist_tag.outputs.tag == 'latest'
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        env:
          BASH_ENV: ""
          ENV: ""
          SHELLOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          LD_DEBUG_OUTPUT: ""
          LD_PROFILE: ""
          GLIBC_TUNABLES: ""
          TAR_OPTIONS: ""
          OPENSSL_CONF: ""
          NODE_DEBUG: ""
          GODEBUG: ""
          NODE_TLS_REJECT_UNAUTHORIZED: "1"
          GH_HOST: github.com
          GH_HTTP_UNIX_SOCKET: ""
          HTTPS_PROXY: ""
          HTTP_PROXY: ""
          ALL_PROXY: ""
          CURL_CA_BUNDLE: ""
          SSL_CERT_FILE: ""
          SSL_CERT_DIR: ""
          NODE_EXTRA_CA_CERTS: ""
          NODE_OPTIONS: ""
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_JOB_DEADLINE_EPOCH: ${{ steps.deadline.outputs.epoch }}
          EXPECTED_VERSION: ${{ steps.npm_publication.outputs.version }}
          EXPECTED_SOURCE_SHA: ${{ steps.npm_publication.outputs.source_sha }}
          EXPECTED_TAG: ${{ steps.npm_publication.outputs.tag }}
          NPM_PROVENANCE_VERIFIED: ${{ steps.npm_provenance.outputs.verified }}
        run: |
          set -euo pipefail
          builtin unset -v https_proxy http_proxy all_proxy
          builtin umask 077
          VERSION="$EXPECTED_VERSION"
          SOURCE_SHA="$EXPECTED_SOURCE_SHA"
          TAG="$EXPECTED_TAG"
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
             ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] ||
             [ "$TAG" != "v$VERSION" ] || [ "$NPM_PROVENANCE_VERIFIED" != "true" ]; then
            echo "::error::Registry publication identity is not one exact provenance-verified stable release"
            exit 1
          fi
          TIMEOUT_BIN=$(type -P timeout)
          CURL_BIN=$(type -P curl)
          GH_BIN=$(type -P gh)
          JQ_BIN=$(type -P jq)
          NODE_BIN=$(type -P node)
          TAR_BIN=$(type -P tar)
          WORK_ROOT=$(/usr/bin/mktemp -d "$RUNNER_TEMP/enquire-mcp-registry.XXXXXX")
          MCP_REGISTRY_HOME="$WORK_ROOT/home"
          PUBLISHER_ROOT="$WORK_ROOT/publisher"
          GH_CONFIG_DIR="$WORK_ROOT/gh-config"
          /bin/mkdir -m 0700 "$MCP_REGISTRY_HOME" "$PUBLISHER_ROOT" "$GH_CONFIG_DIR"
          export GH_CONFIG_DIR
          PACKAGE_JSON_SNAPSHOT="$WORK_ROOT/package.json"
          SERVER_JSON_SNAPSHOT="$WORK_ROOT/server.json"
          EVALUATOR="$GITHUB_WORKSPACE/scripts/check-release-integrity.mjs"
          if [ ! -f "$EVALUATOR" ] || [ -L "$EVALUATOR" ]; then
            echo "::error::Registry evaluator is missing, non-regular, or a symlink"
            exit 1
          fi
          registry_git() {
            "$TIMEOUT_BIN" --kill-after=3s 15s /usr/bin/env -i \
              PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null \
              GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_COUNT=0 GIT_NO_LAZY_FETCH=1 \
              GIT_NO_REPLACE_OBJECTS=1 GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
              /usr/bin/git -C "$GITHUB_WORKSPACE" --no-pager --no-replace-objects "$@"
          }
          if [ "$(registry_git rev-parse HEAD)" != "$SOURCE_SHA" ] ||
             ! registry_git diff --quiet "$SOURCE_SHA" -- package.json server.json; then
            echo "::error::Tracked Registry manifests differ from the exact npm source"
            exit 1
          fi
          for MANIFEST in package.json server.json; do
            if [ ! -f "$GITHUB_WORKSPACE/$MANIFEST" ] || [ -L "$GITHUB_WORKSPACE/$MANIFEST" ]; then
              echo "::error::$MANIFEST is missing, non-regular, or a symlink"
              exit 1
            fi
            SNAPSHOT="$WORK_ROOT/$MANIFEST"
            /bin/cp -- "$GITHUB_WORKSPACE/$MANIFEST" "$SNAPSHOT"
            /bin/chmod 0400 "$SNAPSHOT"
            if [ "$(registry_git rev-parse "$SOURCE_SHA:$MANIFEST")" != "$(registry_git hash-object "$SNAPSHOT")" ]; then
              echo "::error::$MANIFEST snapshot differs from the exact source blob"
              exit 1
            fi
          done
          if ! registry_git diff --quiet "$SOURCE_SHA" -- package.json server.json; then
            echo "::error::Tracked Registry manifests changed during snapshot"
            exit 1
          fi
          PACKAGE_JSON_SHA256=$(/usr/bin/sha256sum "$PACKAGE_JSON_SNAPSHOT")
          PACKAGE_JSON_SHA256=${PACKAGE_JSON_SHA256%% *}
          SERVER_JSON_SHA256=$(/usr/bin/sha256sum "$SERVER_JSON_SNAPSHOT")
          SERVER_JSON_SHA256=${SERVER_JSON_SHA256%% *}
          assert_manifest_snapshots() {
            local package_digest server_digest
            if [ ! -f "$PACKAGE_JSON_SNAPSHOT" ] || [ -L "$PACKAGE_JSON_SNAPSHOT" ] ||
               [ ! -f "$SERVER_JSON_SNAPSHOT" ] || [ -L "$SERVER_JSON_SNAPSHOT" ]; then
              echo "::error::Registry manifest snapshot type changed" >&2
              exit 1
            fi
            package_digest=$(/usr/bin/sha256sum "$PACKAGE_JSON_SNAPSHOT")
            package_digest=${package_digest%% *}
            server_digest=$(/usr/bin/sha256sum "$SERVER_JSON_SNAPSHOT")
            server_digest=${server_digest%% *}
            if [ "$package_digest" != "$PACKAGE_JSON_SHA256" ] || [ "$server_digest" != "$SERVER_JSON_SHA256" ]; then
              echo "::error::Registry manifest snapshot bytes changed" >&2
              exit 1
            fi
          }
          PACKAGE_NAME=$($JQ_BIN -er '.name | select(type == "string")' "$PACKAGE_JSON_SNAPSHOT")
          PACKAGE_VERSION=$($JQ_BIN -er '.version | select(type == "string")' "$PACKAGE_JSON_SNAPSHOT")
          MCP_NAME=$($JQ_BIN -er '.mcpName | select(type == "string")' "$PACKAGE_JSON_SNAPSHOT")
          EXPECTED_SERVER_JSON=$($JQ_BIN -ce '.' "$SERVER_JSON_SNAPSHOT")
          if [ "$PACKAGE_NAME" != "@oomkapwn/enquire-mcp" ] || [ "$PACKAGE_VERSION" != "$VERSION" ] ||
             [ "$MCP_NAME" != "io.github.oomkapwn/enquire-mcp" ] ||
             ! $JQ_BIN -e --arg name "$MCP_NAME" --arg package "$PACKAGE_NAME" --arg version "$VERSION" '
               .name == $name and .version == $version and (.packages | type) == "array" and
               (.packages | length) == 1 and
               all(.packages[]; .identifier == $package and .version == $version)
             ' "$SERVER_JSON_SNAPSHOT" >/dev/null; then
            echo "::error::Registry manifest identity differs from npm publication outputs"
            exit 1
          fi
          require_job_reserve() {
            local required="$1"
            local label="$2"
            if ! [[ "${RELEASE_JOB_DEADLINE_EPOCH:-}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Global release deadline is missing or malformed" >&2
              exit 1
            fi
            local now remaining
            if ! now=$(/bin/date +%s) || ! [[ "$now" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Current epoch is unavailable or malformed" >&2
              return 2
            fi
            remaining=$((RELEASE_JOB_DEADLINE_EPOCH - now))
            if [ "$remaining" -lt "$required" ]; then
              echo "::error::$label requires ${required}s of post-write reserve; only ${remaining}s remain"
              exit 1
            fi
          }
          deadline_timeout() {
            local cap="$1" reserve="$2" label="$3"
            shift 3
            local now remaining limit
            if ! [[ "${RELEASE_JOB_DEADLINE_EPOCH:-}" =~ ^[1-9][0-9]*$ ]] ||
               ! now=$(/bin/date +%s) || ! [[ "$now" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Global release clock is unavailable during $label" >&2
              return 2
            fi
            remaining=$((RELEASE_JOB_DEADLINE_EPOCH - now))
            limit=$((remaining - reserve))
            if [ "$limit" -le 0 ]; then
              echo "::error::Global release deadline has no reserve for $label" >&2
              return 124
            fi
            if [ "$cap" -gt "$limit" ]; then cap="$limit"; fi
            "$TIMEOUT_BIN" --kill-after=5s "${cap}s" "$@"
          }
          gh_read() {
            if [ "${1:-}" != "api" ]; then
              echo "::error::gh_read accepts read-only gh api calls" >&2
              return 2
            fi
            local argument
            for argument in "$@"; do
              case "$argument" in
                graphql|--method|--method=*|-X*|--input|--input=*|-f*|-F*|--field|--field=*|--raw-field|--raw-field=*)
                  echo "::error::gh_read rejects mutation-capable gh api arguments" >&2
                  return 2
                  ;;
              esac
            done
            if ! [[ "${RELEASE_JOB_DEADLINE_EPOCH:-}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Global release deadline is missing or malformed" >&2
              return 2
            fi
            local now remaining
            if ! now=$(/bin/date +%s) || ! [[ "$now" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Current epoch is unavailable or malformed" >&2
              return 2
            fi
            remaining=$((RELEASE_JOB_DEADLINE_EPOCH - now))
            if [ "$remaining" -le 10 ]; then
              echo "::error::Global 230-minute release deadline reached during a GitHub read" >&2
              return 124
            fi
            local limit=20
            if [ "$limit" -gt $((remaining - 10)) ]; then limit=$((remaining - 10)); fi
            "$TIMEOUT_BIN" --kill-after=5s "${limit}s" "$GH_BIN" "$@"
          }
          assert_remote_tag_identity() {
            if ! TAG_REF_JSON=$(gh_read api \
              "repos/${{ github.repository }}/git/ref/tags/$TAG"); then
              echo "::error::Exact-repository tag ref $TAG is unreadable"
              exit 1
            fi
            if ! TAG_OBJECT_SHA=$(printf '%s' "$TAG_REF_JSON" | jq -er --arg ref "refs/tags/$TAG" \
              'select(type == "object" and .ref == $ref) | .object |
               select(type == "object" and .type == "tag") | .sha |
               select(type == "string" and test("^[0-9a-f]{40}$"))'); then
              echo "::error::Exact-repository ref $TAG is not one annotated-tag object"
              exit 1
            fi
            if ! TAG_OBJECT_JSON=$(gh_read api \
              "repos/${{ github.repository }}/git/tags/$TAG_OBJECT_SHA"); then
              echo "::error::Annotated-tag object $TAG_OBJECT_SHA is unreadable"
              exit 1
            fi
            if ! printf '%s' "$TAG_OBJECT_JSON" | jq -e --arg tag "$TAG" --arg sha "$SOURCE_SHA" \
              --arg tag_object_sha "$TAG_OBJECT_SHA" \
              'select(type == "object" and .sha == $tag_object_sha and .tag == $tag) | .object |
               select(type == "object" and .type == "commit" and .sha == $sha)' >/dev/null; then
              echo "::error::Exact-repository tag $TAG must peel to exact source SHA $SOURCE_SHA"
              exit 1
            fi
            if ! TAG_REF_CONFIRM_JSON=$(gh_read api \
              "repos/${{ github.repository }}/git/ref/tags/$TAG") || \
               ! printf '%s' "$TAG_REF_CONFIRM_JSON" | jq -e --arg ref "refs/tags/$TAG" \
                 --arg sha "$TAG_OBJECT_SHA" \
                 'select(type == "object" and .ref == $ref) | .object |
                  select(type == "object" and .type == "tag" and .sha == $sha)' >/dev/null; then
              echo "::error::Exact-repository tag ref $TAG changed during identity proof"
              exit 1
            fi
          }
          SERVER_NAME_ENCODED=$(printf '%s' "$MCP_NAME" | $JQ_BIN -sRr @uri)
          VERSION_ENCODED=$(printf '%s' "$VERSION" | $JQ_BIN -sRr @uri)
          REGISTRY_EXACT_URL="https://registry.modelcontextprotocol.io/v0.1/servers/${SERVER_NAME_ENCODED}/versions/${VERSION_ENCODED}?include_deleted=true"
          REGISTRY_LATEST_URL="https://registry.modelcontextprotocol.io/v0.1/servers/${SERVER_NAME_ENCODED}/versions/latest?include_deleted=true"
          registry_http_read() {
            local url="$1" body_file="$2" response request_exit
            : > "$body_file"
            set +e
            response=$(deadline_timeout 35 10 "MCP Registry read" "$CURL_BIN" --disable \
              --silent --show-error --proxy '' --connect-timeout 10 --max-time 30 \
              --max-filesize 1048576 --retry 0 --proto '=https' --tlsv1.2 \
              --header 'Accept: application/json, application/problem+json' \
              --header 'Cache-Control: no-cache' --output "$body_file" \
              --write-out $'%{http_code}\n%{content_type}' "$url")
            request_exit=$?
            set -e
            REGISTRY_CURL_EXIT="$request_exit"
            REGISTRY_HTTP_STATUS=$(printf '%s\n' "$response" | /usr/bin/sed -n '1p')
            REGISTRY_CONTENT_TYPE=$(printf '%s\n' "$response" | /usr/bin/sed -n '2p')
            if [ -z "$REGISTRY_HTTP_STATUS" ]; then REGISTRY_HTTP_STATUS="000"; fi
          }
          registry_snapshot() {
            local phase="$1" exact_exit exact_status exact_type latest_exit latest_status latest_type payload
            local exact_body="$WORK_ROOT/exact-body.json" latest_body="$WORK_ROOT/latest-body.json"
            assert_manifest_snapshots
            registry_http_read "$REGISTRY_EXACT_URL" "$exact_body"
            exact_exit="$REGISTRY_CURL_EXIT"
            exact_status="$REGISTRY_HTTP_STATUS"
            exact_type="$REGISTRY_CONTENT_TYPE"
            registry_http_read "$REGISTRY_LATEST_URL" "$latest_body"
            latest_exit="$REGISTRY_CURL_EXIT"
            latest_status="$REGISTRY_HTTP_STATUS"
            latest_type="$REGISTRY_CONTENT_TYPE"
            payload=$($JQ_BIN -cn --argjson server "$EXPECTED_SERVER_JSON" \
              --arg package "$PACKAGE_NAME" --arg version "$VERSION" --arg mcpName "$MCP_NAME" \
              --arg exactUrl "$REGISTRY_EXACT_URL" --argjson exactExit "$exact_exit" \
              --arg exactStatus "$exact_status" --arg exactType "$exact_type" --rawfile exactBody "$exact_body" \
              --arg latestUrl "$REGISTRY_LATEST_URL" --argjson latestExit "$latest_exit" \
              --arg latestStatus "$latest_status" --arg latestType "$latest_type" --rawfile latestBody "$latest_body" '
              {expected:{server:$server,package:{name:$package,version:$version,mcpName:$mcpName}},
               exact:{requestUrl:$exactUrl,curlExit:$exactExit,httpStatus:$exactStatus,contentType:$exactType,body:$exactBody},
               latest:{requestUrl:$latestUrl,curlExit:$latestExit,httpStatus:$latestStatus,contentType:$latestType,body:$latestBody}}
            ')
            printf '%s' "$payload" | deadline_timeout 15 10 "MCP Registry evaluator" /usr/bin/env -i \
              HOME="$MCP_REGISTRY_HOME" PATH=/usr/bin:/bin NODE_TLS_REJECT_UNAUTHORIZED=1 \
              "$NODE_BIN" "$EVALUATOR" mcp-registry-state "$phase"
          }
          registry_action() {
            printf '%s' "$1" | $JQ_BIN -er --arg first "$2" --arg second "$3" \
              '.action | select(. == $first or . == $second)'
          }
          assert_remote_tag_identity
          PREFLIGHT_RESULT=$(registry_snapshot preflight)
          PREFLIGHT_ACTION=$(registry_action "$PREFLIGHT_RESULT" publish reuse)
          if [ "$PREFLIGHT_ACTION" = "reuse" ]; then
            assert_remote_tag_identity
            echo "MCP Registry already exposes exact active/latest $MCP_NAME@$VERSION"
            exit 0
          fi
          require_job_reserve 3300 "MCP publisher preparation"
          MCP_PUBLISHER_TAG="v1.7.9"
          MCP_PUBLISHER_SHA256="ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac"
          MCP_PUBLISHER_SIZE="7297012"
          MCP_PUBLISHER_URL="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_TAG}/mcp-publisher_linux_amd64.tar.gz"
          MCP_PUBLISHER_ARCHIVE="$PUBLISHER_ROOT/mcp-publisher_linux_amd64.tar.gz"
          deadline_timeout 70 10 "MCP publisher download" "$CURL_BIN" --disable --fail \
            --silent --show-error --proxy '' --connect-timeout 10 --max-time 60 \
            --max-filesize "$MCP_PUBLISHER_SIZE" --retry 0 --location --max-redirs 1 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$MCP_PUBLISHER_ARCHIVE" "$MCP_PUBLISHER_URL"
          if [ ! -f "$MCP_PUBLISHER_ARCHIVE" ] || [ -L "$MCP_PUBLISHER_ARCHIVE" ] ||
             [ "$(/usr/bin/stat -c '%s' "$MCP_PUBLISHER_ARCHIVE")" != "$MCP_PUBLISHER_SIZE" ]; then
            echo "::error::Pinned MCP publisher archive size or type differs"
            exit 1
          fi
          printf '%s  %s\n' "$MCP_PUBLISHER_SHA256" "$MCP_PUBLISHER_ARCHIVE" | /usr/bin/sha256sum -c -
          PUBLISHER_ENTRIES=$(deadline_timeout 30 10 "MCP publisher inventory" "$TAR_BIN" -tzf "$MCP_PUBLISHER_ARCHIVE")
          if [ "$PUBLISHER_ENTRIES" != "mcp-publisher" ]; then
            echo "::error::Pinned MCP publisher archive must contain exactly one root binary"
            exit 1
          fi
          deadline_timeout 30 10 "MCP publisher extraction" "$TAR_BIN" -xzf "$MCP_PUBLISHER_ARCHIVE" \
            --no-same-owner --no-same-permissions -C "$PUBLISHER_ROOT" -- mcp-publisher
          MCP_PUBLISHER_BIN="$PUBLISHER_ROOT/mcp-publisher"
          if [ ! -f "$MCP_PUBLISHER_BIN" ] || [ -L "$MCP_PUBLISHER_BIN" ]; then
            echo "::error::Extracted MCP publisher is missing, non-regular, or a symlink"
            exit 1
          fi
          /bin/chmod 0500 "$MCP_PUBLISHER_BIN"
          assert_manifest_snapshots
          deadline_timeout 180 10 "MCP manifest validation" /usr/bin/env -i \
            HOME="$MCP_REGISTRY_HOME" PATH=/usr/bin:/bin \
            "$MCP_PUBLISHER_BIN" validate "$SERVER_JSON_SNAPSHOT"
          require_job_reserve 2700 "MCP Registry OIDC login"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC request identity is unavailable"
            exit 1
          fi
          deadline_timeout 180 10 "MCP Registry OIDC login" /usr/bin/env -i \
            HOME="$MCP_REGISTRY_HOME" PATH=/usr/bin:/bin \
            ACTIONS_ID_TOKEN_REQUEST_URL="$ACTIONS_ID_TOKEN_REQUEST_URL" \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN="$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$MCP_PUBLISHER_BIN" login github-oidc --registry=https://registry.modelcontextprotocol.io
          TOKEN_FILE="$MCP_REGISTRY_HOME/.config/mcp-publisher/token.json"
          if [ ! -f "$TOKEN_FILE" ] || [ -L "$TOKEN_FILE" ] ||
             ! $JQ_BIN -e '
               type == "object" and keys == ["method","registry","token"] and
               .method == "github-oidc" and .registry == "https://registry.modelcontextprotocol.io" and
               (.token | type) == "string" and (.token | length) > 0
             ' "$TOKEN_FILE" >/dev/null; then
            echo "::error::MCP publisher OIDC token file is malformed"
            exit 1
          fi
          SECOND_RESULT=$(registry_snapshot preflight)
          SECOND_ACTION=$(registry_action "$SECOND_RESULT" publish reuse)
          if [ "$SECOND_ACTION" = "reuse" ]; then
            assert_remote_tag_identity
            echo "MCP Registry converged before the sole publish boundary"
            exit 0
          fi
          require_job_reserve 2200 "MCP Registry publish and convergence"
          assert_manifest_snapshots
          assert_remote_tag_identity
          MCP_PUBLISH_ATTEMPTED=true
          MCP_PUBLISH_EXIT=0
          set +e
          deadline_timeout 300 1700 "MCP Registry publish" /usr/bin/env -i \
            HOME="$MCP_REGISTRY_HOME" PATH=/usr/bin:/bin \
            "$MCP_PUBLISHER_BIN" publish "$SERVER_JSON_SNAPSHOT"
          MCP_PUBLISH_EXIT=$?
          set -e
          MCP_REGISTRY_CONFIRMED=false
          for attempt in {1..12}; do
            CONVERGENCE_RESULT=$(registry_snapshot convergence)
            CONVERGENCE_ACTION=$(registry_action "$CONVERGENCE_RESULT" confirmed retry)
            if [ "$CONVERGENCE_ACTION" = "confirmed" ]; then
              MCP_REGISTRY_CONFIRMED=true
              break
            fi
            if [ "$attempt" -lt 12 ]; then
              require_job_reserve 20 "MCP Registry convergence retry"
              deadline_timeout 11 10 "MCP Registry convergence wait" /bin/sleep 10
            fi
          done
          if [ "$MCP_PUBLISH_ATTEMPTED" != "true" ] || [ "$MCP_REGISTRY_CONFIRMED" != "true" ]; then
            echo "::error::MCP Registry did not converge after the sole publish invocation; exit=$MCP_PUBLISH_EXIT"
            exit 1
          fi
          assert_remote_tag_identity
          if [ "$MCP_PUBLISH_EXIT" -ne 0 ]; then
            echo "::warning::MCP publisher exited $MCP_PUBLISH_EXIT, but exact active/latest readback proves completion"
          fi
          echo "MCP Registry exact publication is confirmed for $MCP_NAME@$VERSION"
