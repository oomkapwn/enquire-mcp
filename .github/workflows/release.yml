                  echo "::error::npm immutable identity converged to an unexpected publication action"
                  exit 1
                fi
                CONFIRMED_INTEGRITY=$(printf '%s' "$NPM_POST_STATE" | jq -er '.integrity')
                CONFIRMED_CHANNEL_VERSION=$(printf '%s' "$NPM_POST_STATE" | jq -er '.channelVersion')
                if [ "$CONFIRMED_CHANNEL_VERSION" = "$EXPECTED_CHANNEL_VERSION" ]; then
                  NPM_POST_ACTION="$NPM_IDENTITY_ACTION"
                  break
                fi
              fi
            fi
