name: Publish API docs

# v3.6.0-rc.4 — auto-publish the TypeDoc-generated API reference from
# src/tools/* + src/tool-manifest.ts (TSDoc added in rc.3) to GitHub Pages.
# v3.12.0-rc.15 — the Pages root is now a benefit-led human/AI front door;
# TypeDoc remains complete at /api/ and at every historical symbol URL.
# The composite artifact is regenerated on every merge — never committed.

on:
  push:
    branches: [main]
  # Allow manual re-deploys (e.g. if Pages config changes) without a
  # source commit. Useful when toggling GH Pages on for the first time.
  workflow_dispatch:

# Deny by default. The source-building job receives only read access; Pages
# write/OIDC authority exists only inside the protected deployment job.
permissions: {}

# Only one Pages deploy at a time, but don't cancel an in-flight deploy
# (an aborted upload would leave the site in a partial state).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # One dependency-free cross-platform runner owns the exact attempt,
        # process-tree deadline, kill grace and retry policy. OIA Check 10
        # requires this exact invocation instead of accepting an inline loop.
        run: node scripts/npm-ci-with-retry.mjs
      # v3.7.19 round-21 θ3 — lint + build before docs:api. Pre-3.7.19
      # publish-docs.yml ran ONLY `npm run docs:api` — if TypeDoc emitted
      # warnings or generation silently failed, the workflow still
      # uploaded whatever `docs/api-reference` contained (possibly empty
      # or stale from the last build). PR CI's `docs` job (added v3.7.6
      # M-5) already gates this on PR — but the publish workflow ran
      # separately on push-to-main and had no equivalent gate. Adding
      # lint+build ensures the publish path is at least as strict as PR.
      - run: npm run lint
      - run: npm run build
      # Reproduce the same committed social-card bytes checked on PRs before
      # Pages can publish them. This also protects workflow_dispatch/bypass
      # paths from deploying a stale PNG.
      - run: npm run render:preview
      - run: git diff --exit-code -- assets/social-preview.png
      - run: npm run docs:api
      # Builds and fail-closed validates the crawlable landing root, Schema.org
      # graph + FAQ, llms.txt/llms-ctx.txt, social metadata, stable /api/ copy,
      # and legacy TypeDoc symbol paths.
      - run: npm run docs:pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: pages-${{ github.sha }}
          path: .pages-dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: pages-${{ github.sha }}
