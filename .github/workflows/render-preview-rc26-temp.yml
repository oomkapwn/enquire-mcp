name: Temporary rc26 social preview render

on:
  push:
    branches:
      - codex/watcher-generation-v3.12.0-rc.26

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies with bounded retry
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then
              echo "::error::npm ci failed after 3 attempts"
              exit 1
            fi
            sleep 15
          done
      - run: npm run render:preview
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: social-preview-rc26
          path: assets/social-preview.png
          if-no-files-found: error
          retention-days: 1
