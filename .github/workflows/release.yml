          ENV: ""
          SHELLOPTS: ""
          PS4: ""
          LD_PRELOAD: ""
          LD_LIBRARY_PATH: ""
          LD_AUDIT: ""
          LD_DEBUG_OUTPUT: ""
          LD_PROFILE: ""
          GLIBC_TUNABLES: ""
          TAR_OPTIONS: ""
          OPENSSL_CONF: ""
          NODE_DEBUG: ""
          GODEBUG: ""
          NODE_TLS_REJECT_UNAUTHORIZED: "1"
          GH_HOST: github.com
