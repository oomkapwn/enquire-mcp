            CURRENT_CHANNEL_VERSION="-"
            if CURRENT_TAGS_RAW=$(npm view "@oomkapwn/enquire-mcp" dist-tags --json 2>&1); then
              CURRENT_CHANNEL_VERSION=$(printf '%s' "$CURRENT_TAGS_RAW" | jq -er \
                --arg channel "$CHANNEL" \
                'if type != "object" then error("npm dist-tags is not an object") else (.[$channel] // "-") end')
