<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#080c14" stop-opacity="0.98"/>
      <stop offset="0.52" stop-color="#080c14" stop-opacity="0.90"/>
      <stop offset="0.72" stop-color="#080c14" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#080c14" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9f67ff"/>
      <stop offset="1" stop-color="#e065ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9f67ff"/>
      <stop offset="0.42" stop-color="#e065ff"/>
      <stop offset="1" stop-color="#e065ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- The generated 2.5D system art is composited underneath this exact-text overlay. -->
  <rect width="1280" height="640" fill="url(#leftShade)"/>
  <rect x="1" y="1" width="1278" height="638" rx="2" fill="none" stroke="#313750" stroke-opacity="0.55" stroke-width="2"/>

  <g transform="translate(60,48)">
    <rect x="0" y="0" width="38" height="38" rx="10" fill="#111827" stroke="#464c69" stroke-width="1.5"/>
    <circle cx="19" cy="19" r="11" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
    <circle cx="19" cy="19" r="4" fill="#c96cff"/>
    <circle cx="19" cy="19" r="15" fill="#b766ff" opacity="0.16" filter="url(#glow)"/>
  </g>
  <text x="112" y="77" font-size="28" font-weight="780" fill="#f5f7ff" letter-spacing="-0.7">enquire<tspan fill="#be72ff">-mcp</tspan></text>

  <g transform="translate(60,118)">
    <rect width="188" height="35" rx="17.5" fill="#171328" stroke="#7650ac" stroke-width="1.2"/>
    <circle cx="19" cy="17.5" r="4" fill="#63e6be"/>
    <text x="34" y="23" font-size="13" font-weight="850" fill="#d9c8f2" letter-spacing="1.2">#1 OBSIDIAN MCP</text>
  </g>

  <text x="58" y="245" font-size="69" font-weight="850" fill="#f7f8ff" letter-spacing="-2.5">YOUR VAULT.</text>
  <text x="58" y="322" font-size="69" font-weight="850" fill="#f7f8ff" letter-spacing="-2.5">EVERY AGENT.</text>

  <text x="60" y="379" font-size="24" font-weight="650" fill="#cbd2e5">Fresh, cited AI memory. Read-only by default.</text>
  <text x="60" y="413" font-size="19" font-weight="500" fill="#8f99b6">Hybrid Markdown/PDF recall · Dataview/Bases tools.</text>

  <g transform="translate(60,464)" font-size="12" font-weight="850" letter-spacing="0.8">
    <g>
      <rect width="119" height="49" rx="12" fill="#111625" stroke="#303854"/>
      <text x="17" y="21" fill="#7d87a5">MCP TOOLS</text>
      <text x="17" y="39" font-size="17" fill="#f0f2fb">46</text>
    </g>
    <g transform="translate(132,0)">
      <rect width="139" height="49" rx="12" fill="#111625" stroke="#303854"/>
      <text x="17" y="21" fill="#7d87a5">MCP PROMPTS</text>
      <text x="17" y="39" font-size="17" fill="#f0f2fb">19</text>
    </g>
    <g transform="translate(284,0)">
      <rect width="132" height="49" rx="12" fill="#111625" stroke="#303854"/>
      <text x="17" y="21" fill="#7d87a5">TESTS</text>
      <text x="17" y="39" font-size="17" fill="#f0f2fb">1795</text>
    </g>
  </g>

  <line x1="60" y1="558" x2="614" y2="558" stroke="url(#rule)" stroke-width="2"/>
  <text x="60" y="594" font-size="16" font-weight="650" fill="#8c96b2">FRESHNESS-AWARE  ·  CITED  ·  READ-ONLY DEFAULT  ·  MIT</text>
  <rect x="0" y="632" width="1280" height="8" fill="url(#accent)"/>
</svg>
