name: Release to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.12.0). Must already exist."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Version consistency
        run: node scripts/check-version-consistency.mjs
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - name: JSON-RPC smoke test against synthetic vault (scan + FTS5 paths)
        run: |
          VAULT="$(node scripts/synthetic-vault.mjs)"
          node scripts/smoke.mjs "$VAULT"
          node scripts/smoke.mjs "$VAULT" --with-fts
      - name: Resolve npm dist-tag from version
        id: dist_tag
        # Stable releases (v1.0.0, v2.3.4) → `latest`. Prereleases use the
        # SemVer prerelease channel as the dist-tag — `v2.0.0-alpha.0` →
        # `alpha`, `v2.0.0-beta.1` → `beta`, `v2.0.0-rc.0` → `rc`. Users on
        # `npm install @oomkapwn/enquire-mcp` (no @-tag) keep getting stable;
        # alpha/beta testers explicitly opt in via `npm install @oomkapwn/enquire-mcp@alpha`.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Match `<channel>` from `<base>-<channel>.<n>` (e.g. `alpha` from `2.0.0-alpha.0`).
          if [[ "$VERSION" =~ -([a-z]+)\.[0-9]+$ ]]; then
            CHANNEL="${BASH_REMATCH[1]}"
          else
            CHANNEL="latest"
          fi
          echo "tag=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION under dist-tag '$CHANNEL'"
      - name: Publish with provenance
        run: npm publish --provenance --access public --tag "${{ steps.dist_tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
