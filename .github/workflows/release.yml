                  scripts/check-release-integrity.mjs \
                    npm-state "$SOURCE_SHA" "$EXPECTED_INTEGRITY" "$VERSION" "$CHANNEL")
                NPM_IDENTITY_ACTION=$(printf '%s' "$NPM_IDENTITY_RESULT" | jq -er '.action')
