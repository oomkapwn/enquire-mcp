name: Cleanup stale npm dist-tags

# One-shot workflow to remove the `alpha` and `beta` dist-tags that were left
# pointing at the v2.0 prerelease train (`alpha → 2.0.0-alpha.0`,
# `beta → 2.0.0-beta.4`). After v2.0.0 stable shipped, these channels stopped
# moving — the maintainer doesn't ship from prerelease tracks anymore.
#
# Trigger manually via the Actions tab from `main`. The protected
# `npm-maintenance` environment is the authorization boundary for NPM_TOKEN.
# A strict preflight makes an already-absent tag idempotent without masking a
# failed registry mutation, and a fresh parsed observation gates completion.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "REMOVE" to confirm dist-tag deletion'
        required: true
        type: string

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm == 'REMOVE' }}
    permissions:
      contents: read
    environment:
      name: npm-maintenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Classify current dist-tags
        id: preflight
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          npm view @oomkapwn/enquire-mcp dist-tags --json --registry=https://registry.npmjs.org/ \
            --prefer-online --fetch-retries=0 --fetch-timeout=60000 \
            --cache="$RUNNER_TEMP/npm-dist-tag-preflight-cache" |
            node "$GITHUB_WORKSPACE/scripts/npm-dist-tag-policy.mjs" classify >> "$GITHUB_OUTPUT"
      - name: Remove stale alpha dist-tag
        if: ${{ steps.preflight.outputs.alpha_present == 'true' }}
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          npm dist-tag rm @oomkapwn/enquire-mcp alpha --registry=https://registry.npmjs.org/
          --fetch-retries=0 --fetch-timeout=60000
      - name: Remove stale beta dist-tag
        if: ${{ steps.preflight.outputs.beta_present == 'true' }}
        working-directory: ${{ runner.temp }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: >-
          npm dist-tag rm @oomkapwn/enquire-mcp beta --registry=https://registry.npmjs.org/
          --fetch-retries=0 --fetch-timeout=60000
      - name: Verify stale dist-tags are absent
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          npm view @oomkapwn/enquire-mcp dist-tags --json --registry=https://registry.npmjs.org/ \
            --prefer-online --fetch-retries=0 --fetch-timeout=60000 \
            --cache="$RUNNER_TEMP/npm-dist-tag-postcondition-cache" |
            node "$GITHUB_WORKSPACE/scripts/npm-dist-tag-policy.mjs" assert-absent
