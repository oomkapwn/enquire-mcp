          }
          if PUBLISHED=$(npm view "@oomkapwn/enquire-mcp@$VERSION" gitHead --json 2>&1); then
            PUBLISHED_SHA=$(printf '%s' "$PUBLISHED" | parse_git_head)
            CHANNEL_VALUE=$(npm view "@oomkapwn/enquire-mcp" "dist-tags.$CHANNEL" --json)
            PUBLISHED_CHANNEL_VERSION=$(printf '%s' "$CHANNEL_VALUE" | parse_git_head)
            NPM_STATE=$(jq -n --arg gitHead "$PUBLISHED_SHA" --arg channelVersion "$PUBLISHED_CHANNEL_VERSION" \
              '{exists: true, gitHead: $gitHead, channelVersion: $channelVersion}')
