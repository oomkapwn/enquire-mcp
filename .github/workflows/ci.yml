name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify trusted Vitest bootstrap
        shell: /bin/bash --noprofile --norc -p -e -o pipefail {0}
        working-directory: ${{ github.workspace }}
        env:
          BASH_ENV: ""
          ENV: ""
          LC_ALL: C
          LD_PRELOAD: ""
        run: |
          set -u
          manifest=.github/trusted-vitest-bootstrap.sha256
          expected_manifest_sha=bb1bc41248a668bf5bad63b7e221cca4a92e58f7d14d87448a270b99135940f3
          expected_path_sha=5581eea048d9360a3fff43c79e1d55d40492a082ee468ee74c3738f60c2f82f9
          workflow=.github/workflows/ci.yml
          [[ -d .github && ! -L .github ]]
          [[ -d .github/workflows && ! -L .github/workflows ]]
          [[ -f "$manifest" && ! -L "$manifest" ]]
          [[ -f "$workflow" && ! -L "$workflow" ]]
          /usr/bin/printf '%s  %s\n' "$expected_manifest_sha" "$manifest" |
            /usr/bin/sha256sum --check --strict
          last_byte_lf_count=$(/usr/bin/tail -c 1 "$manifest" | /usr/bin/wc -l)
          [[ "$last_byte_lf_count" -eq 1 ]]
          line_count=$(/usr/bin/wc -l < "$manifest")
          [[ "$line_count" -eq 16 ]]
          paths=()
          expected_workflow_sha=
          while IFS= read -r record; do
            [[ "$record" =~ ^[0-9a-f]{64}\ \ [^[:space:]].*$ ]]
            path=${record:66}
            paths+=("$path")
            if [[ "$path" == "$workflow" ]]; then
              expected_workflow_sha=${record:0:64}
            fi
            [[ -f "$path" && ! -L "$path" ]]
            parent=${path%/*}
            while [[ "$parent" != "$path" ]]; do
              [[ -d "$parent" && ! -L "$parent" ]]
              path=$parent
              parent=${path%/*}
            done
          done < "$manifest"
          [[ ${#paths[@]} -eq 16 ]]
          actual_path_sha=$(/usr/bin/printf '%s\n' "${paths[@]}" | /usr/bin/sha256sum)
          actual_path_sha=${actual_path_sha%% *}
          [[ "$actual_path_sha" == "$expected_path_sha" ]]
          [[ -n "$expected_workflow_sha" ]]
          carrier_count=$(/usr/bin/grep -Ec '^          expected_manifest_sha=[0-9a-f]{64}$' "$workflow")
          [[ "$carrier_count" -eq 1 ]]
          actual_workflow_sha=$(
            /usr/bin/sed -E \
              's/^          expected_manifest_sha=[0-9a-f]{64}$/          expected_manifest_sha=<normalized>/' \
              "$workflow" |
              /usr/bin/sha256sum
          )
          actual_workflow_sha=${actual_workflow_sha%% *}
          [[ "$actual_workflow_sha" == "$expected_workflow_sha" ]]
          shopt -s nullglob
          configs=(vitest.config.* vitest.projects.* vitest.workspace.*)
          [[ ${#configs[@]} -eq 1 && "${configs[0]}" == vitest.config.ts ]]
          for forbidden in ".n""pmrc" binding.gyp "n""pm-shrinkwrap.json" .env .env.local .env.test .env.test.local; do
            [[ ! -e "$forbidden" && ! -L "$forbidden" ]]
          done
          /usr/bin/head -n 15 "$manifest" | /usr/bin/sha256sum --check --strict
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # One dependency-free cross-platform runner owns the exact attempt,
        # process-tree deadline, kill grace and retry policy. OIA Check 10
        # requires this exact invocation instead of accepting an inline loop.
        run: node scripts/npm-ci-with-retry.mjs
      - run: npm run lint

  test:
    name: test (${{ matrix.label }})
    # Required gate. Runs on Linux to keep check-run names stable for the
    # branch protection ruleset.
    # v3.5.11 — dropped Node 20 from matrix. pdfjs-dist v5.7+ requires
    # `engines: >=22.13.0` and silently skips on Node 20 (it's an
    # optionalDep), which makes `tsc` fail in the `prepare` hook because
    # static `typeof import("pdfjs-dist")` types can't resolve. Node 20
    # is EOL as of 2026-04, so dropping CI testing on it matches reality.
    # End users on Node 20 still get the prebuilt `dist/` from npm and
    # the PDF feature degrades to "not available" (consistent with how
    # other optional native deps behave).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_CONFIG_ENGINE_STRICT: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          # v3.12.0-rc.22 — exercise the literal public floor, not the latest
          # floating Node 22.x. Keep the label stable because branch protection
          # and the release workflow require the exact `test (22)` context.
          - label: "22"
            node-version: "22.13.0"
            floor: true
          - label: "24"
            node-version: "24"
            floor: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Assert exact declared Node floor
        if: matrix.floor
        run: |
          node -e '
            const declared = require("./package.json").engines?.node;
            const expected = `>=${process.versions.node}`;
            if (declared !== expected) {
              throw new Error(`engines.node=${declared}; exact CI floor=${expected}`);
            }
          '
      - name: Install deps (npm ci with retry)
        # One dependency-free cross-platform runner owns the exact attempt,
        # process-tree deadline, kill grace and retry policy. OIA Check 10
        # requires this exact invocation instead of accepting an inline loop.
        run: node scripts/npm-ci-with-retry.mjs
      - run: npm run build
      - name: Probe native SQLite and FTS5 at declared floor
        if: matrix.floor
        run: |
          node --input-type=module -e '
            import Database from "better-sqlite3";
            const db = new Database(":memory:");
            try {
              db.exec("CREATE VIRTUAL TABLE notes USING fts5(body)");
              db.prepare("INSERT INTO notes(body) VALUES (?)").run("exact floor probe");
              const row = db.prepare("SELECT body FROM notes WHERE notes MATCH ?").get("floor");
              if (row?.body !== "exact floor probe") {
                throw new Error("SQLite FTS5 floor probe returned the wrong row");
              }
            } finally {
              db.close();
            }
          '
      - run: npm test
        env:
          # v3.7.13 L4 — feed the GH token to `tests/github-metadata-invariant.test.ts`
          # so it actually runs `gh api` against the live repo instead of
          # silently no-op'ing. `gh` reads GH_TOKEN before GITHUB_TOKEN; the
          # built-in actions token has `metadata: read` for the workflow's
          # repo, which is exactly what the invariant needs (no escalated
          # permissions required — read-only About/Topics fetch).
          GH_TOKEN: ${{ github.token }}

  test-windows:
    name: test-windows
    # v3.12.0-rc.23 — a real, pinned Windows filesystem lane. The repository's
    # existing lifecycle scripts are deliberately exercised through Git Bash;
    # this is a hostile-filesystem contract, not a cmd.exe compatibility claim.
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      NPM_CONFIG_ENGINE_STRICT: "true"
      NPM_CONFIG_SCRIPT_SHELL: 'C:\Program Files\Git\bin\bash.exe'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Assert real case-insensitive Windows filesystem
        run: |
          node --input-type=module -e '
            import { existsSync, mkdtempSync, rmSync, writeFileSync } from "node:fs";
            import { tmpdir } from "node:os";
            import { join } from "node:path";
            if (process.platform !== "win32") {
              throw new Error(`expected win32, received ${process.platform}`);
            }
            const dir = mkdtempSync(join(tmpdir(), "enquire-win-probe-"));
            try {
              writeFileSync(join(dir, "CaseProbe.md"), "probe");
              if (!existsSync(join(dir, "caseprobe.md"))) {
                throw new Error("Windows filesystem probe is not case-insensitive");
              }
            } finally {
              rmSync(dir, { recursive: true, force: true });
            }
          '
      - name: Install deps (npm ci with retry)
        # POSIX retries require an empty process group. A Windows timeout is
        # terminal because taskkill cannot prove escaped descendants are gone.
        run: node scripts/npm-ci-with-retry.mjs
      - run: npm run build
      - name: Probe native SQLite and FTS5 on Windows
        run: |
          node --input-type=module -e '
            import Database from "better-sqlite3";
            const db = new Database(":memory:");
            try {
              db.exec("CREATE VIRTUAL TABLE notes USING fts5(body)");
              db.prepare("INSERT INTO notes(body) VALUES (?)").run("windows probe");
              const row = db.prepare("SELECT body FROM notes WHERE notes MATCH ?").get("windows");
              if (row?.body !== "windows probe") {
                throw new Error("Windows SQLite FTS5 probe returned the wrong row");
              }
            } finally {
              db.close();
            }
          '
      - run: npm test -- tests/windows-path-safety.test.ts
      - name: Test watcher startup interlock on Windows
        run: npm test -- tests/watcher-activation-guard.test.ts

  test-macos:
    # v2.0.0-beta.3: cross-platform advisory job (not required by branch
    # protection, doesn't block merges). Catches macOS-specific path /
    # symlink / chmod regressions on Apple silicon. `macos-latest` is a
    # floating image label, so the executable architecture assertion below
    # must fail if it no longer resolves to the arm64 lane claimed here.
    runs-on: macos-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps (npm ci with retry)
        # One dependency-free cross-platform runner owns the exact attempt,
        # process-tree deadline, kill grace and retry policy. OIA Check 10
        # requires this exact invocation instead of accepting an inline loop.
        run: node scripts/npm-ci-with-retry.mjs
      - name: Assert expected runner architecture
        env:
          EXPECTED_ARCH: arm64
        run: |
          node -e '
            const expected = process.env.EXPECTED_ARCH;
            if (!["x64", "arm64"].includes(expected) || process.arch !== expected) {
              throw new Error(`expected Node architecture ${expected}; received ${process.arch}`);
            }
          '
      - run: npm run build
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    # v3.11.0-rc.9 (audit I-COV-1 re-verify) — this instrumented lane retains
    # its independently measured 10m budget. It excludes the two exhaustive
    # transition-oracle files whose full-suite Node floor now owns a 20m job
    # boundary, then runs changelog/per-file gates after the V8 measurement.
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # One dependency-free cross-platform runner owns the exact attempt,
        # process-tree deadline, kill grace and retry policy. OIA Check 10
        # requires this exact invocation instead of accepting an inline loop.
        run: node scripts/npm-ci-with-retry.mjs
      # v3.9.0-rc.26 (rc.25-audit LOW-2) — explicit build (matches the `test`
      # job). Previously dist/ existed only via the `npm ci` `prepare` hook; if
      # that hook ever changed (or `--ignore-scripts`), every distExists()-gated
      # test would silently no-op here and the per-file FLOORS would be measured
      # against a run where the CLI/E2E paths never executed. The cli.test.ts
      # CI-GUARD now also asserts dist is built — this makes that precondition
      # explicit rather than a side effect.
      - run: npm run build
      - run: npm run test:coverage
      # v3.5.12 — gate that CHANGELOG's claimed coverage stats match reality
      # within 0.5pp. Closes the class of bug v3.5.10 audit caught (inflated
      # stats copy-pasted from sub-agent output).
      - run: npm run check:changelog-coverage
      # v3.7.0 — per-file branch coverage floors for security-critical modules.
      # Global threshold (74%) alone hides per-file dips into the 66-68% range
      # (http-transport.ts, tools/search.ts, tools/meta.ts, tools/media.ts).
      # Floors set ~2pp below current values; updates require CHANGELOG note.
      - run: npm run check:per-file-coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

  # v3.7.6 M-5 (external audit) — TypeDoc generation gate. README claims
  # "drift-free API reference auto-generated from source TSDoc on every push",
  # but pre-fix `npm run docs:api` was only run by the publish-docs workflow
  # on push-to-main, NOT on PR. A PR could land with broken @link references
  # or other TypeDoc warnings, and the drift only surfaced AFTER merge.
  # Now: PR CI verifies docs:api runs cleanly + emits no warnings.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # One dependency-free cross-platform runner owns the exact attempt,
        # process-tree deadline, kill grace and retry policy. OIA Check 10
        # requires this exact invocation instead of accepting an inline loop.
        run: node scripts/npm-ci-with-retry.mjs
      - run: npm run build
      # D-45 remote-only validation: SDK migrations may intentionally change
      # the exact tools/list JSON Schema dialect. Capture the runner-observed
      # inventory, export it before the fail-closed diff, and let maintainers
      # review/commit those protocol bytes without executing a server locally.
      - id: schema_inventory
        run: npm run schema:inventory -- --write
      - name: Export remotely captured MCP schema inventory
        id: schema_inventory_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: emitted-mcp-schema-inventory
          path: tests/fixtures/mcp-schema-inventory.v1.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Require committed MCP schema inventory
        id: schema_inventory_diff
        run: git diff --exit-code -- tests/fixtures/mcp-schema-inventory.v1.json
      # The SVG carries exact proof counts used in the README/social card.
      # Regenerate the committed PNG remotely and fail on byte drift so the
      # binary asset cannot silently lag its reviewable source.
      - id: preview_render
        run: npm run render:preview
      # D-45 remote-only validation: preserve the runner-generated PNG before
      # the expected byte-drift failure so maintainers never need Sharp/node
      # execution on a local workstation to refresh this committed asset.
      - name: Export remotely rendered social preview
        id: preview_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rendered-social-preview
          path: assets/social-preview.png
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Require committed social-preview bytes
        id: preview_diff
        run: git diff --exit-code -- assets/social-preview.png
      # TypeDoc warnings on PR — treat as failure so doc drift fails CI,
      # not silently lands on main. The shell pipe captures the output and
      # greps for the "Found N warnings" / "Found N errors" lines.
      - name: TypeDoc generation (warnings = CI failure)
        run: |
          set -o pipefail
          npm run docs:api 2>&1 | tee /tmp/typedoc.log
          if grep -E "^\\[(warning|error)\\]|Found [1-9][0-9]* warning|Found [1-9][0-9]* error" /tmp/typedoc.log; then
            echo "::error::TypeDoc emitted warnings or errors — fix them before merge"
            exit 1
          fi
      # The Pages root is a human/AI landing page while the generated reference
      # remains available at /api/ and every historical symbol URL. Build and
      # validate that composite artifact on PRs, not only after merge.
      - run: npm run docs:pages

  # v3.7.19 (round-21 self-audit θ1) — Outside-In Audit job.
  # The OIA script (added v3.7.17) catches "state-driven" drift that
  # internal change-driven sweeps miss (stale CLI subcommands in docs,
  # version-drifted file headers, shell-script staleness, etc.).
  #
  # v3.7.19: added as ADVISORY (continue-on-error=true) for one release
  # cycle of production observation. v3.8.0-rc.6 (round-23 audit response):
  # promoted to REQUIRED — one full release cycle confirmed zero false
  # positives. Also added to the release.yml REQUIRED gate list (9 total).
  oia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Check 6 consumes the coverage job's exact same-run measurement. Without
    # this dependency, a fresh OIA runner has no coverage-summary.json and the
    # drift check cannot make an evidence-backed decision.
    needs: coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # One dependency-free cross-platform runner owns the exact attempt,
        # process-tree deadline, kill grace and retry policy. OIA Check 10
        # requires this exact invocation instead of accepting an inline loop.
        run: node scripts/npm-ci-with-retry.mjs
      - name: Download same-run coverage evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: coverage
          digest-mismatch: error
      # OIA doesn't need a build — it greps source + docs and consumes the
      # downloaded coverage/coverage-summary.json. Skip `npm run build`.
      - run: npm run check:oia

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Keep the protected/release-required `smoke` context name stable while
    # making the Windows filesystem lane a real blocking prerequisite.
    needs: [test, test-windows]
    if: ${{ always() }}
    env:
      NPM_CONFIG_ENGINE_STRICT: "true"
    steps:
      - name: Require Linux and Windows test prerequisites
        env:
          LINUX_TEST_RESULT: ${{ needs.test.result }}
          WINDOWS_TEST_RESULT: ${{ needs['test-windows'].result }}
        run: |
          if [ "$LINUX_TEST_RESULT" != "success" ] || [ "$WINDOWS_TEST_RESULT" != "success" ]; then
            echo "::error::test=$LINUX_TEST_RESULT test-windows=$WINDOWS_TEST_RESULT"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # v3.12.0-rc.22 — run the MCP/FTS smoke at the literal public floor.
          node-version: "22.13.0"
          cache: npm
      - name: Install deps (npm ci with retry)
        # One dependency-free cross-platform runner owns the exact attempt,
        # process-tree deadline, kill grace and retry policy. OIA Check 10
        # requires this exact invocation instead of accepting an inline loop.
        run: node scripts/npm-ci-with-retry.mjs
      - run: npm run build
      - name: Build synthetic vault
        id: vault
        run: echo "path=$(node scripts/synthetic-vault.mjs)" >> "$GITHUB_OUTPUT"
      - name: JSON-RPC smoke test (scan path)
        run: node scripts/smoke.mjs "${{ steps.vault.outputs.path }}"
      - name: JSON-RPC smoke test (FTS5 --persistent-index path)
        run: node scripts/smoke.mjs "${{ steps.vault.outputs.path }}" --with-fts

  # v4.0.0-rc.1 — official MCP client v2 against the built public entries.
  # Unlike the raw JSON-RPC smoke, this proves version negotiation, SDK
  # serialization, transport adapters, inventory parity, and a real read-only
  # call across modern/legacy × stdio/HTTP. The script creates only a synthetic
  # runner vault and includes auth, traversal, and write-surface negative controls.
  protocol-conformance-matrix:
    name: protocol-conformance (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      NPM_CONFIG_ENGINE_STRICT: "true"
      NPM_CONFIG_SCRIPT_SHELL: ${{ matrix.script_shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
            script_shell: /bin/bash
          - label: windows
            os: windows-2025
            script_shell: 'C:\Program Files\Git\bin\bash.exe'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps (npm ci with retry)
        # POSIX retries require an empty process group. A Windows timeout is
        # terminal because taskkill cannot prove escaped descendants are gone.
        run: node scripts/npm-ci-with-retry.mjs
      - run: npm run build
      - name: Verify modern and legacy stdio/HTTP with official client v2
        run: node scripts/protocol-conformance.mjs

  protocol-conformance:
    name: protocol-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: protocol-conformance-matrix
    if: ${{ always() }}
    steps:
      - name: Require every protocol-conformance platform
        env:
          MATRIX_RESULT: ${{ needs['protocol-conformance-matrix'].result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::protocol-conformance matrix result=$MATRIX_RESULT"
            exit 1
          fi
          echo "All protocol-conformance platform lanes passed"

  # One exact-SHA Linux producer creates the only npm tarball admitted to the
  # three-platform consumer matrix and the later release controller. The
  # manifest binds the tarball bytes to this source SHA and run attempt.
  npm-package:
    name: npm-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NPM_CONFIG_ENGINE_STRICT: "true"
      NPM_CONFIG_SCRIPT_SHELL: /bin/bash
    outputs:
      artifact_name: ${{ steps.artifact_identity.outputs.name }}
      artifact_id: ${{ steps.npm_export.outputs.artifact-id }}
      artifact_digest: ${{ steps.npm_export.outputs.artifact-digest }}
      producer_attempt: ${{ steps.artifact_identity.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps (npm ci with retry)
        run: node scripts/npm-ci-with-retry.mjs
      - run: npm run build
      - name: Verify one-build npm artifact pipeline
        run: node scripts/check-npm-package-pipeline.mjs
      - name: Bind npm artifact identity to the producer attempt
        id: artifact_identity
        run: |
          echo "name=npm-package-candidate-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Build one canonical npm tarball and source receipt
        shell: bash
        run: |
          set -euo pipefail
          PACK_DIR="$RUNNER_TEMP/enquire-npm-pack-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          PACK_JSON="$RUNNER_TEMP/enquire-npm-pack-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          if [ -e "$PACK_DIR" ] || [ -e "$PACK_JSON" ] || [ -e npm-package ]; then
            echo "::error::canonical npm artifact scratch path already exists"
            exit 1
          fi
          mkdir "$PACK_DIR" npm-package
          npm pack --json --ignore-scripts --pack-destination "$PACK_DIR" > "$PACK_JSON"
          PACK_BASENAME=$(node -e '
            const { readFileSync } = require("node:fs");
            const value = JSON.parse(readFileSync(process.argv[1], "utf8"));
            const name = Array.isArray(value) && value.length === 1 ? value[0]?.filename : "";
            if (typeof name !== "string" || name.length === 0 || name.includes("/") || name.includes("\\")) process.exit(2);
            process.stdout.write(name);
          ' "$PACK_JSON")
          mv "$PACK_DIR/$PACK_BASENAME" npm-package/enquire-mcp-npm.tgz
          rmdir "$PACK_DIR"
          node scripts/npm-package-artifact.mjs create \
            "$PACK_JSON" npm-package/enquire-mcp-npm.tgz npm-package/npm-package-manifest.json \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          node scripts/npm-package-artifact.mjs verify \
            npm-package/npm-package-manifest.json npm-package/enquire-mcp-npm.tgz \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Export canonical npm tarball and source receipt
        id: npm_export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact_identity.outputs.name }}
          path: |
            npm-package/enquire-mcp-npm.tgz
            npm-package/npm-package-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # v4.0.0-rc.1 — test the exact artifact users install, not independently
  # repacked per-OS trees. Every OS installs the canonical Linux bytes normally
  # and with --omit=optional, typechecks public subpaths, executes the packaged
  # CLI, and exercises Vault privacy/read-only defaults. The aggregate job is
  # the single fail-closed release context.
  package-consumer-matrix:
    name: package-consumer (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: npm-package
    defaults:
      run:
        shell: bash
    env:
      NPM_CONFIG_ENGINE_STRICT: "true"
      NPM_CONFIG_SCRIPT_SHELL: ${{ matrix.script_shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
            arch: x64
            script_shell: /bin/bash
          - label: windows
            os: windows-2025
            arch: x64
            script_shell: 'C:\Program Files\Git\bin\bash.exe'
          - label: macos
            os: macos-latest
            arch: arm64
            script_shell: /bin/bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps (npm ci with retry)
        # POSIX retries require an empty process group. A Windows timeout is
        # terminal because taskkill cannot prove escaped descendants are gone.
        run: node scripts/npm-ci-with-retry.mjs
      - name: Assert expected runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e '
            const expected = process.env.EXPECTED_ARCH;
            if (!["x64", "arm64"].includes(expected) || process.arch !== expected) {
              throw new Error(`expected Node architecture ${expected}; received ${process.arch}`);
            }
          '
      - run: npm run build
      - name: Download exact canonical npm candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.npm-package.outputs.artifact_name }}
          path: artifacts/npm-package
          digest-mismatch: error
      - name: Verify canonical consumers with and without optional dependencies
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.npm-package.outputs.producer_attempt }}
        run: |
          node scripts/package-consumer.mjs \
            --tarball artifacts/npm-package/enquire-mcp-npm.tgz \
            --manifest artifacts/npm-package/npm-package-manifest.json \
            --source-sha "$SOURCE_SHA" --run-id "$SOURCE_RUN_ID" --run-attempt "$SOURCE_RUN_ATTEMPT"

  package-consumer:
    name: package-consumer
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: package-consumer-matrix
    if: ${{ always() }}
    steps:
      - name: Require every package-consumer platform
        env:
          MATRIX_RESULT: ${{ needs['package-consumer-matrix'].result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::package-consumer matrix result=$MATRIX_RESULT"
            exit 1
          fi
          echo "All package-consumer platform lanes passed"

  # v4.0.0-rc.2 — one canonical Linux build produces the exact candidate that
  # release.yml will later download, re-verify, and publish. It is verified before export,
  # and its bundle, logical inventory, CycloneDX SBOM, and third-party notices
  # remain downloadable for pre-merge inspection under the no-local-workload
  # policy. The real Claude Desktop install UI remains maintainer-gated.
  mcpb-basic-package:
    name: mcpb-basic-package
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact_identity.outputs.name }}
    env:
      NPM_CONFIG_ENGINE_STRICT: "true"
      NPM_CONFIG_SCRIPT_SHELL: /bin/bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps (npm ci with retry)
        # POSIX retries require an empty process group. A Windows timeout is
        # terminal because taskkill cannot prove escaped descendants are gone.
        run: node scripts/npm-ci-with-retry.mjs
      - run: npm run build
      - name: Build Basic read-only MCPB with pinned packer
        run: npm run mcpb:build
      - name: Verify canonical Linux MCPB before export
        run: npm run mcpb:verify
      - name: Bind artifact identity to the producer attempt
        id: artifact_identity
        run: echo "name=mcpb-basic-candidate-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Export inspectable canonical MCPB candidate and transparency records
        id: mcpb_export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact_identity.outputs.name }}
          path: |
            artifacts/enquire-mcp-basic-*.mcpb
            artifacts/enquire-mcp-basic-*.content-manifest.json
            artifacts/enquire-mcp-basic-*.sbom.cdx.json
            artifacts/enquire-mcp-basic-*.third-party-licenses.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Verify uploaded MCPB artifact through Actions REST
        env:
          BASH_ENV: ""
          GH_HOST: github.com
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.mcpb_export.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.mcpb_export.outputs.artifact-digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::upload-artifact returned an invalid artifact ID"
            exit 1
          fi
          if [[ ! "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::upload-artifact returned a digest that is not 64 lowercase hex characters"
            exit 1
          fi

          CANDIDATE_ZIP=$(mktemp "$RUNNER_TEMP/mcpb-artifact-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ARTIFACT_ID}.XXXXXX.zip")
          downloaded=false
          for attempt in {1..12}; do
            if timeout --kill-after=5s 30s gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$CANDIDATE_ZIP"; then
              ACTUAL_DIGEST=$(sha256sum "$CANDIDATE_ZIP" | awk '{print $1}')
              if [ "$ACTUAL_DIGEST" != "$ARTIFACT_DIGEST" ]; then
                echo "::error::downloaded Actions artifact digest differs from upload output"
                exit 1
              fi
              downloaded=true
              break
            fi
            echo "::warning::Actions artifact $ARTIFACT_ID is not downloadable yet (attempt $attempt/12)"
            if [ "$attempt" -lt 12 ]; then
              sleep 5
            fi
          done
          if [ "$downloaded" != "true" ]; then
            echo "::error::Actions artifact $ARTIFACT_ID was not downloadable after 12 bounded attempts"
            exit 1
          fi
          echo "Verified Actions artifact id=$ARTIFACT_ID sha256=$ARTIFACT_DIGEST"

  # Every supported OS consumes those same canonical Linux-built bytes. This
  # catches extraction/path/runtime drift without letting per-OS assembly hide
  # a problem in the artifact users will actually download.
  mcpb-basic-matrix:
    name: mcpb-basic (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: mcpb-basic-package
    defaults:
      run:
        shell: bash
    env:
      NPM_CONFIG_ENGINE_STRICT: "true"
      NPM_CONFIG_SCRIPT_SHELL: ${{ matrix.script_shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux
            os: ubuntu-latest
            arch: x64
            script_shell: /bin/bash
          - label: windows
            os: windows-2025
            arch: x64
            script_shell: 'C:\Program Files\Git\bin\bash.exe'
          - label: macos
            os: macos-latest
            arch: arm64
            script_shell: /bin/bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps (npm ci with retry)
        # POSIX retries require an empty process group. A Windows timeout is
        # terminal because taskkill cannot prove escaped descendants are gone.
        run: node scripts/npm-ci-with-retry.mjs
      - name: Assert expected runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node -e '
            const expected = process.env.EXPECTED_ARCH;
            if (!["x64", "arm64"].includes(expected) || process.arch !== expected) {
              throw new Error(`expected Node architecture ${expected}; received ${process.arch}`);
            }
          '
      - name: Download canonical Linux MCPB candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs['mcpb-basic-package'].outputs.artifact_name }}
          path: artifacts
          digest-mismatch: error
      - name: Verify canonical MCPB content and official-client contract
        run: npm run mcpb:verify

  mcpb-basic:
    name: mcpb-basic
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: mcpb-basic-matrix
    if: ${{ always() }}
    steps:
      - name: Require every Basic MCPB platform
        env:
          MATRIX_RESULT: ${{ needs['mcpb-basic-matrix'].result }}
        run: |
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "::error::mcpb-basic matrix result=$MATRIX_RESULT"
            exit 1
          fi
          echo "All Basic MCPB platform lanes passed"

  audit:
    # v2.0.0-beta.3: elevate from --audit-level=high to moderate for prod
    # deps. Pre-fix, the ip-address moderate XSS advisory sat undetected
    # between Dependabot scans because audit didn't gate on it. Production
    # transitive deps are usually safe, but elevating closes that gap.
    # Dev deps stay at high (test/build tooling, less surface, more noise).
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # v3.5.11 — bumped from 20 → 22 because pdfjs v5+ requires it.
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # One dependency-free cross-platform runner owns the exact attempt,
        # process-tree deadline, kill grace and retry policy. OIA Check 10
        # requires this exact invocation instead of accepting an inline loop.
        run: node scripts/npm-ci-with-retry.mjs
      # v3.11.7-rc.8 — audit both this root lockfile and the dependency graph a registry
      # consumer resolves without our root-only overrides. Scope-specific exceptions must
      # carry a rationale + removal tracker; new or stale advisories fail closed.
      - name: Audit source and published-consumer dependency graphs
        run: /usr/bin/timeout --kill-after=10s 300s npm run check:audit

  version-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - run: node scripts/check-version-consistency.mjs

  # v3.10.0-rc.27 — Docker image build + MCP introspection smoke. MCP directories
  # (Glama → awesome-mcp-servers) build the Dockerfile and call tools/list over
  # stdio; this job verifies the image BUILDS and ANSWERS, so the
  # "Glama-introspectable" claim is ENFORCED (anti-overclaim), not aspirational,
  # and the Dockerfile is guarded against rot. The context remains outside the
  # branch-protection set, but release.yml now evaluates its exact successful
  # conclusion before publication. Uses only the already-SHA-pinned checkout
  # action + `docker` (preinstalled on the runner):
  # no new action to SHA-pin, and no `npm ci` (the build runs npm INSIDE the
  # image), so OIA Checks 9/10 don't apply.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the introspection image
        run: docker build -t enquire-mcp:ci .
      - name: CLI smoke — the bin runs inside the image
        # here-string `grep <<<` avoids the `grep -q` early-close EPIPE that, under
        # the runner's `bash -e`, would abort the step even on a successful match.
        env:
          BASH_ENV: ""
        shell: bash
        run: |
          docker_status=0
          out=$(timeout --kill-after=10s 60s docker run --rm enquire-mcp:ci --help) || docker_status=$?
          if [ "$docker_status" -ne 0 ]; then
            echo "::error::Docker CLI smoke exited with status $docker_status"
            printf '%s\n' "$out" | tail -c 600
            exit 1
          fi
          grep -qi 'serve' <<<"$out" || { echo "::error::--help did not list the serve subcommand"; printf '%s\n' "$out" | tail -c 600; exit 1; }
          echo "OK — bin runs in image; --help lists serve"
      - name: MCP tools/list smoke — stdio introspection (what Glama does)
        env:
          BASH_ENV: ""
        shell: bash
        run: |
          docker_status=0
          out=$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | timeout --kill-after=10s 90s docker run --rm -i enquire-mcp:ci) || docker_status=$?
          if [ "$docker_status" -ne 0 ]; then
            echo "::error::Docker MCP smoke exited with status $docker_status"
            printf '%s\n' "$out" | tail -c 1000
            exit 1
          fi
          grep -q '"obsidian_search"' <<<"$out" || { echo "::error::tools/list did not return obsidian_search from the container"; printf '%s\n' "$out" | tail -c 1000; exit 1; }
          echo "OK — tools/list returned obsidian_search over stdio"
