name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      - run: npm run lint

  test:
    # Required gate. Runs on Linux to keep check-run names stable for the
    # branch protection ruleset.
    # v3.5.11 — dropped Node 20 from matrix. pdfjs-dist v5.7+ requires
    # `engines: >=22.13.0` and silently skips on Node 20 (it's an
    # optionalDep), which makes `tsc` fail in the `prepare` hook because
    # static `typeof import("pdfjs-dist")` types can't resolve. Node 20
    # is EOL as of 2026-04, so dropping CI testing on it matches reality.
    # End users on Node 20 still get the prebuilt `dist/` from npm and
    # the PDF feature degrades to "not available" (consistent with how
    # other optional native deps behave).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      - run: npm run build
      - run: npm test
        env:
          # v3.7.13 L4 — feed the GH token to `tests/github-metadata-invariant.test.ts`
          # so it actually runs `gh api` against the live repo instead of
          # silently no-op'ing. `gh` reads GH_TOKEN before GITHUB_TOKEN; the
          # built-in actions token has `metadata: read` for the workflow's
          # repo, which is exactly what the invariant needs (no escalated
          # permissions required — read-only About/Topics fetch).
          GH_TOKEN: ${{ github.token }}

  test-macos:
    # v2.0.0-beta.3: cross-platform advisory job (not required by branch
    # protection, doesn't block merges). Catches macOS-specific path /
    # symlink / chmod regressions on Apple silicon. The user dogfoods on
    # macOS arm64 — bugs that only show up there used to ship until manual
    # smoke caught them.
    runs-on: macos-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      - run: npm run build
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      - run: npm run test:coverage
      # v3.5.12 — gate that CHANGELOG's claimed coverage stats match reality
      # within 0.5pp. Closes the class of bug v3.5.10 audit caught (inflated
      # stats copy-pasted from sub-agent output).
      - run: npm run check:changelog-coverage
      # v3.7.0 — per-file branch coverage floors for security-critical modules.
      # Global threshold (74%) alone hides per-file dips into the 66-68% range
      # (http-transport.ts, tools/search.ts, tools/meta.ts, tools/media.ts).
      # Floors set ~2pp below current values; updates require CHANGELOG note.
      - run: npm run check:per-file-coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

  # v3.7.6 M-5 (external audit) — TypeDoc generation gate. README claims
  # "drift-free API reference auto-generated from source TSDoc on every push",
  # but pre-fix `npm run docs:api` was only run by the publish-docs workflow
  # on push-to-main, NOT on PR. A PR could land with broken @link references
  # or other TypeDoc warnings, and the drift only surfaced AFTER merge.
  # Now: PR CI verifies docs:api runs cleanly + emits no warnings.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      - run: npm run build
      # TypeDoc warnings on PR — treat as failure so doc drift fails CI,
      # not silently lands on main. The shell pipe captures the output and
      # greps for the "Found N warnings" / "Found N errors" lines.
      - name: TypeDoc generation (warnings = CI failure)
        run: |
          set -o pipefail
          npm run docs:api 2>&1 | tee /tmp/typedoc.log
          if grep -E "^\\[(warning|error)\\]|Found [1-9][0-9]* warning|Found [1-9][0-9]* error" /tmp/typedoc.log; then
            echo "::error::TypeDoc emitted warnings or errors — fix them before merge"
            exit 1
          fi

  # v3.7.19 (round-21 self-audit θ1) — Outside-In Audit job.
  # The OIA script (added v3.7.17) catches "state-driven" drift that
  # internal change-driven sweeps miss (stale CLI subcommands in docs,
  # version-drifted file headers, shell-script staleness, etc.).
  #
  # v3.7.19: added as ADVISORY (continue-on-error=true) for one release
  # cycle of production observation. v3.8.0-rc.6 (round-23 audit response):
  # promoted to REQUIRED — one full release cycle confirmed zero false
  # positives. Also added to the release.yml REQUIRED gate list (9 total).
  oia:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      # OIA doesn't need a build — it greps source + docs. Skip `npm run build`.
      - run: npm run check:oia

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # v3.5.11 — bumped from 20 → 22 because pdfjs v5+ requires it.
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      - run: npm run build
      - name: Build synthetic vault
        id: vault
        run: echo "path=$(node scripts/synthetic-vault.mjs)" >> "$GITHUB_OUTPUT"
      - name: JSON-RPC smoke test (scan path)
        run: node scripts/smoke.mjs "${{ steps.vault.outputs.path }}"
      - name: JSON-RPC smoke test (FTS5 --persistent-index path)
        run: node scripts/smoke.mjs "${{ steps.vault.outputs.path }}" --with-fts

  audit:
    # v2.0.0-beta.3: elevate from --audit-level=high to moderate for prod
    # deps. Pre-fix, the ip-address moderate XSS advisory sat undetected
    # between Dependabot scans because audit didn't gate on it. Production
    # transitive deps are usually safe, but elevating closes that gap.
    # Dev deps stay at high (test/build tooling, less surface, more noise).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          # v3.5.11 — bumped from 20 → 22 because pdfjs v5+ requires it.
          node-version: 22
          cache: npm
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --include=dev --audit-level=high

  version-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
      - run: node scripts/check-version-consistency.mjs
