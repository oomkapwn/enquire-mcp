name: Release to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.12.0). Must already exist."
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Version consistency
        run: node scripts/check-version-consistency.mjs
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - name: JSON-RPC smoke test against synthetic vault (scan + FTS5 paths)
        run: |
          VAULT="$(node scripts/synthetic-vault.mjs)"
          node scripts/smoke.mjs "$VAULT"
          node scripts/smoke.mjs "$VAULT" --with-fts
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
