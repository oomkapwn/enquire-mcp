          RELEASE_JOB_DEADLINE_EPOCH: ${{ steps.deadline.outputs.epoch }}
        run: |
          set -euo pipefail
          GH_CONFIG_DIR=$(/usr/bin/mktemp -d "$RUNNER_TEMP/enquire-gh-config.XXXXXX")
