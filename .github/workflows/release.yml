          FINAL_DIR=".mcpb-release-final-$GITHUB_RUN_ID"
          if [ -e "$FINAL_DIR" ]; then
            echo "::error::Final release identity path already exists: $FINAL_DIR"
            exit 1
          fi
          mkdir "$FINAL_DIR"
          while IFS= read -r REMOTE_NAME; do
            if [ "$REMOTE_NAME" != "$(basename "$ASSET")" ] && \
               [ "$REMOTE_NAME" != "$(basename "$ASSET.sha256")" ] && \
               [ "$REMOTE_NAME" != "$(basename "$CONTENT")" ] && \
               [ "$REMOTE_NAME" != "$(basename "$SBOM")" ] && \
               [ "$REMOTE_NAME" != "$(basename "$LICENSES")" ] && \
               [ "$REMOTE_NAME" != "$(basename "$ASSET.provenance.json")" ]; then
              echo "::error::Final release contains unexpected asset $REMOTE_NAME"
              exit 1
            fi
          done < <(printf '%s' "$FINAL_ASSETS" | jq -r '.[].name')
          for LOCAL_ASSET in "$ASSET" "$ASSET.sha256" "$CONTENT" "$SBOM" "$LICENSES" "$ASSET.provenance.json"; do
            NAME=$(basename "$LOCAL_ASSET")
            MATCH_COUNT=$(printf '%s' "$FINAL_ASSETS" | jq --arg name "$NAME" \
              '[.[] | select(.name == $name)] | length')
            if [ "$MATCH_COUNT" -ne 1 ]; then
              echo "::error::Final release does not contain exactly one $NAME"
              exit 1
            fi
            REMOTE_ID=$(printf '%s' "$FINAL_ASSETS" | jq -r --arg name "$NAME" \
              '.[] | select(.name == $name) | .id')
            gh api -H "Accept: application/octet-stream" \
              "repos/${{ github.repository }}/releases/assets/$REMOTE_ID" > "$FINAL_DIR/$NAME"
            if ! cmp -s "$LOCAL_ASSET" "$FINAL_DIR/$NAME"; then
              echo "::error::Final release asset $NAME differs before draft publication"
              exit 1
            fi
          done
          PUBLISH_RELEASE=$(gh api "repos/${{ github.repository }}/releases/$RELEASE_ID")
          PUBLISH_ASSET_PAGES=$(gh api --paginate --slurp \
            "repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100")
          PUBLISH_ASSETS=$(printf '%s' "$PUBLISH_ASSET_PAGES" | jq 'add // []')
          PUBLISH_STATE=$(jq -n --argjson release "$PUBLISH_RELEASE" --argjson assets "$PUBLISH_ASSETS" \
            '{release: $release, assets: $assets}')
          FINAL_ACTION=$(printf '%s' "$PUBLISH_STATE" | release_state | jq -r '.action')
          assert_remote_tag_identity
          if [ "$FINAL_ACTION" = "publish_draft" ]; then
            if [ "${{ steps.dist_tag.outputs.tag }}" = "latest" ]; then
              gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
                -F draft=false -F prerelease=false -f make_latest=true >/dev/null
            else
              gh api --method PATCH "repos/${{ github.repository }}/releases/$RELEASE_ID" \
                -F draft=false -F prerelease=true -f make_latest=false >/dev/null
            fi
          elif [ "$FINAL_ACTION" != "reuse_published" ]; then
            echo "::error::Exact six-asset set produced unexpected release action $FINAL_ACTION"
            exit 1
          fi
          RELEASE_PAGES=$(gh api --paginate --slurp \
            "repos/${{ github.repository }}/releases?per_page=100")
          RELEASES=$(printf '%s' "$RELEASE_PAGES" | jq 'add // []')
          RELEASE_COUNT=$(printf '%s' "$RELEASES" | jq --arg tag "$TAG" \
            '[.[] | select(.tag_name == $tag)] | length')
          if [ "$RELEASE_COUNT" -ne 1 ]; then
            echo "::error::Published release postcondition requires exactly one release for $TAG"
            exit 1
          fi
          RELEASE_JSON=$(printf '%s' "$RELEASES" | jq --arg tag "$TAG" \
            '.[] | select(.tag_name == $tag)')
          assert_remote_tag_identity
          FINAL_PRERELEASE=$(printf '%s' "$RELEASE_JSON" | jq -r '.prerelease')
          FINAL_DRAFT=$(printf '%s' "$RELEASE_JSON" | jq -r '.draft')
          if [ "$FINAL_PRERELEASE" != "$EXPECTED_PRERELEASE" ] || [ "$FINAL_DRAFT" != "false" ]; then
            echo "::error::Published release postcondition does not match exact annotated-tag source/channel identity"
            exit 1
          fi
          if [ "${{ steps.dist_tag.outputs.tag }}" = "latest" ]; then
            LATEST_TAG=$(gh api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
            if [ "$LATEST_TAG" != "$TAG" ]; then
              echo "::error::Published stable release $TAG is not GitHub's latest release"
              exit 1
            fi
          fi
      # v3.9.0-rc.32 — automate the official MCP Registry publish via GitHub
      # Actions OIDC (no interactive login, no dedicated secret — `id-token:
      # write` above is the only requirement; the registry trusts the repo's
      # OIDC identity for the `io.github.oomkapwn/*` namespace).
      #
      # STABLE-ONLY: the registry's `isLatest` should reflect what users get
      # from `npm install @oomkapwn/enquire-mcp` (the `latest` dist-tag), NOT a
      # prerelease — otherwise the canonical listing (which Glama / mcp.so /
      # smithery auto-sync from) would advertise an `-rc.N` as current. RC tags
      # publish to npm under `@rc` but are SKIPPED here. This closes the
      # registry-drift class: pre-3.9.0-rc.32 the registry was published
      # manually (`mcp-publisher publish` after each stable), and it silently
      # fell ~7 versions behind (stuck at 3.8.4 while npm was at 3.8.8).
      - name: Publish to MCP Registry (stable only)
        if: steps.dist_tag.outputs.tag == 'latest'
        run: |
          set -euo pipefail
          # server.json is version-pinned by check-version-consistency.mjs to
          # match package.json, so on a stable run it already carries the
          # just-published stable version. Re-sync defensively in case the tag
          # was cut from a tree where server.json lagged.
          VERSION=$(node -p "require('./package.json').version")
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('server.json','utf8'));s.version='${VERSION}';if(s.packages)for(const p of s.packages)p.version='${VERSION}';fs.writeFileSync('server.json',JSON.stringify(s,null,2)+'\n')"
          # Download the official publisher CLI. v3.9.0-rc.33 (external-audit
          # M-9): PINNED to an exact release tag (not `releases/latest`) so a
          # re-tagged/compromised upstream "latest" can't silently change the
          # binary that runs with our OIDC identity in the publish path.
          # v3.10.0-rc.26 (SYS-1 / M-9 completion): CONTENT-pin too — a tag can be
          # force-moved (delete+recreate) or a release asset re-uploaded, so verify
          # the tarball's SHA256 before it runs. `ubuntu-latest` is linux/amd64;
          # bump MCP_PUBLISHER_SHA256 *together with* MCP_PUBLISHER_TAG (deliberate;
          # get the hash from `curl -fsSL <url> | sha256sum`). `sha256sum -c` exits
          # non-zero on mismatch → the step fails closed, aborting the publish.
          MCP_PUBLISHER_TAG="v1.7.9"
          MCP_PUBLISHER_SHA256="ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_TAG}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "Published $VERSION to the MCP Registry"
