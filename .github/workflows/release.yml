          }
          PACKUMENT=$(mktemp "$RUNNER_TEMP/enquire-npm-packument.XXXXXX")
          if [ ! -f "$PACKUMENT" ] || [ -L "$PACKUMENT" ]; then
            echo "::error::npm packument scratch file is missing, non-regular, or a symlink"
            exit 1
