name: Capture release mutation fixture

on:
  push:
    branches: [codex/runtime-patches-refresh-20260809]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Restore frozen legacy matrix in the disposable runner
        env:
          FROZEN_SOURCE_COMMIT: 8420e2fca3ed0dac994859a9e9a30b933d5ddf9e
          FROZEN_SOURCE_SHA256: 3fa0b67411e2fc0f4d7c6bce6075ba91eb25edc19a210b5c2f8dd408def6e18b
        run: |
          git show "$FROZEN_SOURCE_COMMIT:tests/release-integrity.test.ts" > "$RUNNER_TEMP/release-integrity.test.ts"
          printf '%s  %s\n' "$FROZEN_SOURCE_SHA256" "$RUNNER_TEMP/release-integrity.test.ts" | sha256sum --check --strict
          cp "$RUNNER_TEMP/release-integrity.test.ts" tests/release-integrity.test.ts
      - name: Generate fixture
        run: node scripts/generate-release-mutation-identity.mjs > "$RUNNER_TEMP/release-mutation-identity.v2.json"
      - name: Upload fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-mutation-identity-${{ github.sha }}
          path: ${{ runner.temp }}/release-mutation-identity.v2.json
          if-no-files-found: error
          retention-days: 1
