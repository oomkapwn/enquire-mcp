name: Regenerate the dependency lockfile

# One-shot maintenance workflow, added 2026-10-11. Delete it once the regenerated
# lockfile is merged.
#
# Why it exists: D-45 forbids package-manager commands on the maintainer MacBook, so
# package-lock.json cannot be regenerated there. package-lock.json still carried 106
# non-dev entries that are unreachable from package.json (a removed
# onnxruntime-node → global-agent → roarr → sprintf-js subtree among them), which
# made `npm audit --omit=dev` score a production graph that does not exist — and that
# is how a moderate sprintf-js advisory with no upstream fix reached a prod scope
# that is, by construction, not allowlistable.
#
# It runs `npm install --package-lock-only`, which rewrites the lock from
# package.json without installing a tree and without running lifecycle scripts, then
# refreshes the trusted Vitest bootstrap receipt that pins package-lock.json. The
# result is uploaded as an artifact rather than pushed, so the regenerated bytes
# still land through a reviewed pull request.

on:
  workflow_dispatch:

permissions: {}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The lockfile bytes must land through a reviewed pull request, so the
    # regeneration itself only ever runs on a working branch. Dispatch it on
    # the branch that will carry the lockfile change, never on main.
    if: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.0"
      - name: Regenerate the lockfile from package.json alone
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Refresh the trusted Vitest bootstrap receipt
        run: node scripts/generate-vitest-bootstrap.mjs
      - name: Report the dependency-input delta
        run: git --no-pager diff --stat -- package-lock.json .github/trusted-vitest-bootstrap.sha256 .github/workflows/ci.yml
      - name: Upload the regenerated dependency inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regenerated-lock-inputs
          path: |
            package-lock.json
            .github/trusted-vitest-bootstrap.sha256
            .github/workflows/ci.yml
          if-no-files-found: error
          retention-days: 3
          compression-level: 0