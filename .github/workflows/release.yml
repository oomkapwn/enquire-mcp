            echo "::error::npm exact SRI/channel state did not converge after 12 bounded reads; publish exit=$NPM_PUBLISH_EXIT"
            exit 1
          fi
          if [ "$CONFIRMED_INTEGRITY" != "$EXPECTED_INTEGRITY" ]; then
            echo "::error::npm did not expose the canonical tarball integrity; publish exit=$NPM_PUBLISH_EXIT"
            exit 1
          fi
          if [ "$CONFIRMED_CHANNEL_VERSION" != "$EXPECTED_CHANNEL_VERSION" ]; then
            echo "::error::npm dist-tag $CHANNEL does not resolve to expected $EXPECTED_CHANNEL_VERSION; publish exit=$NPM_PUBLISH_EXIT"
            exit 1
          fi
          assert_remote_tag_identity
          if [ "$NPM_PUBLISH_ATTEMPTED" = "true" ] && [ "$NPM_PUBLISH_EXIT" -ne 0 ]; then
            echo "::warning::npm publish exited $NPM_PUBLISH_EXIT, but exact tarball SRI, channel, and tag postconditions prove publication completed"
          fi
          {
            printf 'version=%s\n' "$VERSION"
            printf 'source_sha=%s\n' "$SOURCE_SHA"
            printf 'tag=%s\n' "$TAG"
            printf 'integrity=%s\n' "$EXPECTED_INTEGRITY"
            printf 'publication_action=%s\n' "$NPM_ACTION"
            printf 'publish_attempted=%s\n' "$NPM_PUBLISH_ATTEMPTED"
            printf 'run_id=%s\n' "$PROVENANCE_RUN_ID"
            printf 'run_attempt=%s\n' "$PROVENANCE_RUN_ATTEMPT"
