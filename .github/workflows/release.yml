              --arg tag_object_sha "$TAG_OBJECT_SHA" \
              'select(type == "object" and .sha == $tag_object_sha and .tag == $tag) | .object |
               select(type == "object" and .type == "commit" and .sha == $sha)' >/dev/null; then
