          GH_HOST: github.com
          GH_HTTP_UNIX_SOCKET: ""
          HTTPS_PROXY: ""
          https_proxy: ""
          HTTP_PROXY: ""
          http_proxy: ""
          ALL_PROXY: ""
          all_proxy: ""
          CURL_CA_BUNDLE: ""
          SSL_CERT_FILE: ""
          SSL_CERT_DIR: ""
          NODE_EXTRA_CA_CERTS: ""
