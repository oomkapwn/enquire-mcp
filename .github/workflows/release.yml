          CONTENT="artifacts/enquire-mcp-basic-$VERSION.content-manifest.json"
          SBOM="artifacts/enquire-mcp-basic-$VERSION.sbom.cdx.json"
          LICENSES="artifacts/enquire-mcp-basic-$VERSION.third-party-licenses.json"
