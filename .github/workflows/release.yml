name: Release to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.12.0). Must already exist."
        required: true
        type: string

concurrency:
  group: release-publication
  cancel-in-progress: false

permissions:
  # Read the exact-SHA CI artifact that already passed the cross-platform
  # mcpb-basic gate and the exact workflow-run attempt's jobs; explicit maps
  # otherwise default omitted scopes to none.
  actions: read
  # `contents: write` (was `read` pre-3.7.15) — required for the
  # "Create GitHub Release" step (v3.7.14 F5) to call the GitHub Releases
  # API. The first end-to-end test of F5 (v3.7.14 tag push) failed with
  # `HTTP 403: Resource not accessible by integration` because GitHub's
  # default GITHUB_TOKEN since 2023 grants only read on `contents`.
  # Documented as overclaim #9 in v3.7.15 CHANGELOG. The npm publish
  # step is unaffected (it uses NODE_AUTH_TOKEN from `secrets.NPM_TOKEN`).
  contents: write
  # `id-token: write` — npm provenance OIDC token signing.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A global 230-minute workflow deadline leaves a 10-minute runner buffer.
    # Later transaction-specific reserves consume this common clock instead of
    # pretending that independent command timeouts compose automatically.
    timeout-minutes: 240
    steps:
      - name: Establish global release deadline
        run: echo "RELEASE_JOB_DEADLINE_EPOCH=$(($(date +%s) + 13800))" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # We need full history so we can verify the tagged SHA is reachable
          # from `main` (P0 release-pipeline integrity check below).
          fetch-depth: 0
      # v2.0.0-beta.2 P0 release-pipeline integrity check.
      # Pre-fix: a tag pointing at any commit (even one that never landed on
      # main) would publish, because release.yml only re-ran lint/test/audit
      # in-job. An attacker with commit access could `git tag v9.9.9 <evil-sha>
      # && git push --tags` and ship malware bypassing main protections.
      # Now we assert the tagged SHA is on main AND that CI was green on it.
      - name: Assert tag is on main and required CI checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          GH_BIN=$(type -P gh)
          TIMEOUT_BIN=$(type -P timeout)
          CI_GATE_DEADLINE=$((SECONDS + 3600))
          gate_timeout() {
            local cap="$1"
            shift
            local remaining=$((CI_GATE_DEADLINE - SECONDS))
            if [ "$remaining" -le 10 ]; then
              echo "::error::Exact-SHA CI gate reached its absolute 60-minute deadline" >&2
              return 124
            fi
            local limit="$cap"
            if [ "$limit" -gt $((remaining - 10)) ]; then limit=$((remaining - 10)); fi
            "$TIMEOUT_BIN" --kill-after=10s "${limit}s" "$@"
          }
          gh_read() {
            if [ "${1:-}" != "api" ]; then
              echo "::error::gh_read accepts read-only gh api calls" >&2
              return 2
            fi
            local argument
            for argument in "$@"; do
              case "$argument" in
                graphql|--method|--method=*|-X*|--input|--input=*|-f*|-F*|--field|--field=*|--raw-field|--raw-field=*)
                  echo "::error::gh_read rejects mutation-capable gh api arguments" >&2
                  return 2
                  ;;
              esac
            done
            gate_timeout 20 "$GH_BIN" "$@"
          }
          ci_wait() {
            local message="$1"
            if [ $((CI_GATE_DEADLINE - SECONDS)) -le 30 ]; then
              echo "::error::Exact-SHA CI gate reached its absolute 60-minute deadline"
              exit 1
            fi
            echo "$message"
            sleep 30
          }
          TAG="$RELEASE_TAG"
          VERSION=$(node -p "require('./package.json').version")
          node scripts/check-release-integrity.mjs assert-tag "$TAG" "$VERSION"
          SHA=$(git rev-parse HEAD)
          echo "Tagged SHA: $SHA"
          "$TIMEOUT_BIN" --kill-after=10s 120s git fetch origin main --depth=200
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::Tagged SHA $SHA is not on main — refusing to publish (someone tagged a commit that wasn't merged through PR review)."
            exit 1
          fi
          echo "✓ SHA is on main"
          # Verify the required CI jobs passed on this exact SHA. The
          # exact-run `filter=all` view exposes every rerun execution. The
          # shared evaluator validates every identity and selects the unique
          # maximum run_attempt independently per required name, preserving
          # untouched successes after rerun-failed. Tag pushes
          # can race with CI on main starting — poll for up to 60 minutes. The
          # v4 package-consumer matrix alone has a 30-minute runner budget, so
          # the former five-minute poll could reject a healthy immediate tag.
          # v3.5.11 — dropped `test (20)` from required checks because
          # pdfjs-dist v5+ requires Node `>=22.13` (Node 20 is EOL as of
          # 2026-04). Required count was 7 (lint, test×2, smoke, audit,
          # coverage, version-consistency).
          # v3.7.10 — bumped to 8 by adding `docs` (TypeDoc generation gate
          # from v3.7.6 M-5; round-12 audit caught that the release gate
          # didn't track this CI check, so a tag with failing TypeDoc could
          # have published to npm).
          # v3.8.0-rc.6 — bumped to 9 by adding `oia` (Outside-In Audit;
          # promoted from advisory after one release cycle with 0 false
          # positives — round-23 audit response).
          # v4.0.0-rc.1 — bumped to 11: `protocol-conformance` aggregates Linux
          # + Windows official-v2-client modern/legacy stdio/HTTP lanes; the
          # aggregated `package-consumer` context requires packed-artifact checks
          # on Linux, Windows, and macOS (normal + --omit=optional installs).
          # v4.0.0-rc.2 — bumped to 12: `mcpb-basic` aggregates three-OS
          # canonical Linux bundle assembly plus three-OS logical-content and
          # official-client read-only verification of those same exact bytes.
          # Public gate-count mirror; tests pin this exact inventory to the
          # shared evaluator used below. Do not use a regex/count as readiness.
          REQUIRED="lint|test \(22\)|test \(24\)|smoke|audit|coverage|version-consistency|docs|oia|protocol-conformance|package-consumer|mcpb-basic"
          REQ_COUNT=12
          for (( attempt=1; attempt<=120; attempt++ )); do
            if ! CI_RUN_PAGES=$(gh_read api --paginate --slurp \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$SHA&per_page=100"); then
              if [ "$attempt" -eq 120 ]; then
                echo "::error::Exact ci.yml workflow run remained unreadable after 60 minutes"
                exit 1
              fi
              ci_wait "CI workflow-run lookup failed (attempt $attempt/120) — waiting 30s..."
              continue
            fi
            CI_RUNS=$(printf '%s' "$CI_RUN_PAGES" | node scripts/check-release-integrity.mjs \
              flatten-field workflow_runs)
            CI_RUN_COUNT=$(printf '%s' "$CI_RUNS" | jq 'length')
            if [ "$CI_RUN_COUNT" -gt 1 ]; then
              echo "::error::More than one exact ci.yml main-push run exists for $SHA"
              exit 1
            fi
            if [ "$CI_RUN_COUNT" -eq 0 ]; then
              if [ "$attempt" -eq 120 ]; then
                echo "::error::No exact ci.yml main-push run appeared for $SHA after 60 minutes"
                exit 1
              fi
              ci_wait "Exact ci.yml main-push run is not visible (attempt $attempt/120) — waiting 30s..."
              continue
            fi
            WORKFLOW_RUN=$(printf '%s' "$CI_RUNS" | jq '.[0]')
            WORKFLOW_RUN_ID=$(printf '%s' "$WORKFLOW_RUN" | jq -er \
              '.id | select(type == "number" and . > 0 and floor == . and . <= 9007199254740991)')
            if ! JOB_PAGES=$(gh_read api --paginate --slurp \
              "repos/${{ github.repository }}/actions/runs/$WORKFLOW_RUN_ID/jobs?filter=all&per_page=100"); then
              if [ "$attempt" -eq 120 ]; then
                echo "::error::Exact CI workflow-run attempt jobs remained unreadable after 60 minutes"
                exit 1
              fi
              ci_wait "CI workflow-run attempt job lookup failed (attempt $attempt/120) — waiting 30s..."
              continue
            fi
            JOBS=$(printf '%s' "$JOB_PAGES" | node scripts/check-release-integrity.mjs flatten-field jobs)
            JSON=$(jq -n --argjson workflow_run "$WORKFLOW_RUN" --argjson jobs "$JOBS" \
              '{workflow_run: $workflow_run, jobs: $jobs}')
            RESULT=$(printf '%s' "$JSON" | node scripts/check-release-integrity.mjs checks "$SHA")
            STATE=$(printf '%s' "$RESULT" | jq -r '.state')
            if [ "$STATE" = "failed" ]; then
              echo "::error::Required CI checks failed on $SHA"
              printf '%s' "$RESULT" | jq -r '.failed[] | "\(.name): \(.conclusion)"'
              exit 1
            fi
            DONE=$(printf '%s' "$RESULT" | jq -r '.succeeded | length')
            if [ "$STATE" = "ready" ]; then
              echo "✓ All $REQ_COUNT distinct required jobs passed on $SHA"
              break
            fi
            if [ "$attempt" -eq 120 ]; then
              MISSING=$(printf '%s' "$RESULT" | jq -r '[.missing[], .pending[]] | join(", ")')
              echo "::error::Timed out waiting for CI on $SHA after 60 minutes; unresolved: $MISSING"
              exit 1
            fi
            UNRESOLVED=$(printf '%s' "$RESULT" | jq -r '[.missing[], .pending[]] | join(", ")')
            ci_wait "CI still running ($DONE/$REQ_COUNT distinct jobs passed; unresolved: $UNRESOLVED; attempt $attempt/120) — waiting 30s..."
          done
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.0"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install deps (npm ci with retry)
        # v3.9.0-rc.20 — retry guards the recurring onnxruntime-node postinstall
        # CDN ETIMEDOUT flake (hit rc.9 + failed the rc.19 release). Dependency-free
        # bash loop — no new action to SHA-pin. OIA Check 10 forbids bare `npm ci`.
        run: |
          for n in 1 2 3; do
            npm ci && break
            if [ "$n" -eq 3 ]; then echo "::error::npm ci failed after 3 attempts"; exit 1; fi
            echo "::warning::npm ci attempt $n failed (transient — e.g. onnxruntime postinstall CDN ETIMEDOUT); retrying in 15s"
            sleep 15
          done
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          # v3.7.19 ι class — feed GH_TOKEN so tests/github-metadata-invariant.test.ts
          # actually runs `gh api` against the live repo instead of silent-skip.
          # PR CI's `test` job has this since v3.7.13 L4; release.yml never got
          # the parity update — caught by round-21 self-audit class ι (CI vs
          # release config drift).
          GH_TOKEN: ${{ github.token }}
      - name: Version consistency
        run: node scripts/check-version-consistency.mjs
      # v3.7.19 ι class — align audit-level with PR CI (release-time blind-spot fix).
      # v3.11.7-rc.8 — the shared wrapper audits both the root lockfile and the graph a
      # registry consumer resolves without root-only overrides. New and stale advisories
      # fail closed; any scope-specific exception needs a rationale + removal tracker.
      - name: Audit source and published-consumer dependency graphs
        run: npm run check:audit
      - name: JSON-RPC smoke test against synthetic vault (scan + FTS5 paths)
        run: |
          VAULT="$(node scripts/synthetic-vault.mjs)"
          node scripts/smoke.mjs "$VAULT"
          node scripts/smoke.mjs "$VAULT" --with-fts
      - name: Download exact CI-gated Basic MCPB release asset
        id: mcpb_candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GH_BIN=$(type -P gh)
          TIMEOUT_BIN=$(type -P timeout)
          gh_read() {
            if [ "${1:-}" != "api" ]; then
              echo "::error::gh_read accepts read-only gh api calls" >&2
              return 2
            fi
            local argument
            for argument in "$@"; do
              case "$argument" in
                graphql|--method|--method=*|-X*|--input|--input=*|-f*|-F*|--field|--field=*|--raw-field|--raw-field=*)
                  echo "::error::gh_read rejects mutation-capable gh api arguments" >&2
                  return 2
                  ;;
              esac
            done
            if ! [[ "${RELEASE_JOB_DEADLINE_EPOCH:-}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Global release deadline is missing or malformed" >&2
              return 2
            fi
            local remaining=$((RELEASE_JOB_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 10 ]; then
              echo "::error::Global 230-minute release deadline reached during a GitHub read" >&2
              return 124
            fi
            local limit=20
            if [ "$limit" -gt $((remaining - 10)) ]; then limit=$((remaining - 10)); fi
            "$TIMEOUT_BIN" --kill-after=5s "${limit}s" "$GH_BIN" "$@"
          }
          SOURCE_SHA=$(git rev-parse HEAD)
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          PROVENANCE_NAME="enquire-mcp-basic-$VERSION.mcpb.provenance.json"
          if [ -e artifacts ]; then
            echo "::error::artifacts path already exists before canonical MCPB download"
            exit 1
          fi
          RESUME_DIR=".mcpb-release-resume-$GITHUB_RUN_ID"
          if [ -e "$RESUME_DIR" ]; then
            echo "::error::release-resume identity path already exists: $RESUME_DIR"
            exit 1
          fi
          mkdir "$RESUME_DIR"

          # If a prior attempt already attached deterministic provenance, it
          # pins the canonical build run for every later retry. Otherwise the
          # oldest successful exact-SHA main-push candidate is canonical.
          CI_RUN_ID=""
          PROVENANCE_RUN_ID=""
          PINNED_RUN_ATTEMPT=""
          PINNED_ARTIFACT_ID=""
          PINNED_ARTIFACT_DIGEST=""
          RELEASE_PAGES=$(gh_read api --paginate --slurp \
            "repos/${{ github.repository }}/releases?per_page=100")
          RELEASES=$(printf '%s' "$RELEASE_PAGES" | node scripts/check-release-integrity.mjs \
            flatten-pages release)
          RELEASE_COUNT=$(printf '%s' "$RELEASES" | jq --arg tag "$TAG" \
            '[.[] | select(.tag_name == $tag)] | length')
          if [ "$RELEASE_COUNT" -gt 1 ]; then
            echo "::error::GitHub returned duplicate draft/published releases for $TAG"
            exit 1
          fi
          if [ "$RELEASE_COUNT" -eq 1 ]; then
            RELEASE_JSON=$(printf '%s' "$RELEASES" | jq --arg tag "$TAG" \
              '.[] | select(.tag_name == $tag)')
            RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -er \
              '.id | select(type == "number" and . > 0 and floor == . and . <= 9007199254740991)')
            RELEASE_ASSET_PAGES=$(gh_read api --paginate --slurp \
              "repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100")
            RELEASE_ASSETS=$(printf '%s' "$RELEASE_ASSET_PAGES" | node scripts/check-release-integrity.mjs \
              flatten-pages asset)
            PROVENANCE_COUNT=$(printf '%s' "$RELEASE_ASSETS" | jq --arg name "$PROVENANCE_NAME" \
              '[.[] | select(.name == $name)] | length')
            if [ "$PROVENANCE_COUNT" -gt 1 ]; then
              echo "::error::Release $TAG contains duplicate provenance assets"
              exit 1
            fi
            if [ "$PROVENANCE_COUNT" -eq 1 ]; then
              RESUME_PROVENANCE="$RESUME_DIR/$PROVENANCE_NAME"
              PROVENANCE_ID=$(printf '%s' "$RELEASE_ASSETS" | jq -er --arg name "$PROVENANCE_NAME" \
                '.[] | select(.name == $name) | .id | select(type == "number" and . > 0 and floor == . and . <= 9007199254740991)')
              gh_read api -H "Accept: application/octet-stream" \
                "repos/${{ github.repository }}/releases/assets/$PROVENANCE_ID" > "$RESUME_PROVENANCE"
              PROVENANCE_SOURCE=$(jq -r '.source_sha // empty' "$RESUME_PROVENANCE")
              PROVENANCE_ARTIFACT=$(jq -r '.artifact // empty' "$RESUME_PROVENANCE")
              BUILD_URL=$(jq -r '.build_workflow_run // empty' "$RESUME_PROVENANCE")
              PROVENANCE_RUN_ID="${BUILD_URL##*/}"
              PINNED_RUN_ATTEMPT=$(jq -r '.build_run_attempt // empty' "$RESUME_PROVENANCE")
              PINNED_ARTIFACT_ID=$(jq -r '.build_artifact_id // empty' "$RESUME_PROVENANCE")
              PINNED_ARTIFACT_DIGEST=$(jq -r '.build_artifact_digest // empty' "$RESUME_PROVENANCE")
              if [ "$PROVENANCE_SOURCE" != "$SOURCE_SHA" ] || \
                 [ "$PROVENANCE_ARTIFACT" != "enquire-mcp-basic-$VERSION.mcpb" ] || \
                 ! [[ "$PROVENANCE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || \
                 ! [[ "$PINNED_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || \
                 ! [[ "$PINNED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || \
                 ! [[ "$PINNED_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                echo "::error::Existing release provenance does not identify this source/artifact"
                exit 1
              fi
            fi
          fi

          RUN_PAGES=$(gh_read api --paginate --slurp \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$SOURCE_SHA&per_page=100")
          RUNS=$(printf '%s' "$RUN_PAGES" | node scripts/check-release-integrity.mjs \
            flatten-field workflow_runs)
          while IFS= read -r CANDIDATE_RUN_ID; do
            if [ -n "$PROVENANCE_RUN_ID" ] && [ "$CANDIDATE_RUN_ID" != "$PROVENANCE_RUN_ID" ]; then
              continue
            fi
            JOB_PAGES=$(gh_read api --paginate --slurp \
              "repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN_ID/jobs?filter=all&per_page=100")
            JOBS=$(printf '%s' "$JOB_PAGES" | node scripts/check-release-integrity.mjs flatten-field jobs)
            ARTIFACT_PAGES=$(gh_read api --paginate --slurp \
              "repos/${{ github.repository }}/actions/runs/$CANDIDATE_RUN_ID/artifacts?per_page=100")
            CANDIDATE_ARTIFACTS=$(printf '%s' "$ARTIFACT_PAGES" | node scripts/check-release-integrity.mjs \
              flatten-field artifacts)
            CANDIDATE_RUN=$(printf '%s' "$RUNS" | jq -ce --argjson id "$CANDIDATE_RUN_ID" \
              '[.[] | select(.id == $id)] | if length == 1 then .[0] else error("candidate run identity changed") end')
            CANDIDATE_PAYLOAD=$(jq -n --argjson workflow_run "$CANDIDATE_RUN" \
              --argjson jobs "$JOBS" --argjson artifacts "$CANDIDATE_ARTIFACTS" \
              '{workflow_run: $workflow_run, jobs: $jobs, artifacts: $artifacts}')
            CANDIDATE_RESULT=$(printf '%s' "$CANDIDATE_PAYLOAD" | node scripts/check-release-integrity.mjs \
              candidate "$SOURCE_SHA" "${PINNED_RUN_ATTEMPT:--}" \
              "${PINNED_ARTIFACT_ID:--}" "${PINNED_ARTIFACT_DIGEST:--}")
            if [ "$(printf '%s' "$CANDIDATE_RESULT" | jq -r '.state')" = "skip" ]; then continue; fi
            CI_RUN_ID="$CANDIDATE_RUN_ID"
            PINNED_RUN_ATTEMPT=$(printf '%s' "$CANDIDATE_RESULT" | jq -r '.runAttempt')
            PINNED_ARTIFACT_ID=$(printf '%s' "$CANDIDATE_RESULT" | jq -r '.artifactId')
            PINNED_ARTIFACT_DIGEST=$(printf '%s' "$CANDIDATE_RESULT" | jq -r '.digest')
            break
          done < <(printf '%s' "$RUNS" | node scripts/check-release-integrity.mjs candidate-runs "$SOURCE_SHA" | \
            jq -r '.[]')
          if [ -z "$CI_RUN_ID" ]; then
            echo "::error::No exact-SHA main push CI run has both a successful mcpb-basic job and live candidate artifact"
            exit 1
          fi
          CANDIDATE_ZIP="$RESUME_DIR/mcpb-basic-candidate-$PINNED_RUN_ATTEMPT-$PINNED_ARTIFACT_ID.zip"
          # Actions artifact archives negotiate the GitHub JSON media type and
          # redirect to the ZIP. `application/octet-stream` is reserved for the
          # separate Releases asset endpoint and is rejected here with HTTP 415.
          gh_read api -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/artifacts/$PINNED_ARTIFACT_ID/zip" > "$CANDIDATE_ZIP"
          ACTUAL_ARTIFACT_DIGEST="sha256:$(sha256sum "$CANDIDATE_ZIP" | awk '{print $1}')"
          if [ "$ACTUAL_ARTIFACT_DIGEST" != "$PINNED_ARTIFACT_DIGEST" ]; then
            echo "::error::Downloaded Actions artifact digest differs from the selected API identity"
            exit 1
          fi
          mkdir artifacts
          CANDIDATE_ZIP="$CANDIDATE_ZIP" VERSION="$VERSION" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { unzipSync } from "fflate";
            import { portableArchivePath } from "./scripts/lib/mcpb-safety.mjs";
            const expected = new Set([
              `enquire-mcp-basic-${process.env.VERSION}.mcpb`,
              `enquire-mcp-basic-${process.env.VERSION}.content-manifest.json`,
              `enquire-mcp-basic-${process.env.VERSION}.sbom.cdx.json`,
              `enquire-mcp-basic-${process.env.VERSION}.third-party-licenses.json`
            ]);
            const entries = unzipSync(readFileSync(process.env.CANDIDATE_ZIP));
            if (Object.keys(entries).length !== expected.size) process.exit(2);
            for (const [rawName, data] of Object.entries(entries)) {
              const name = portableArchivePath(rawName);
              if (name !== rawName || !expected.delete(name)) process.exit(3);
              writeFileSync(`artifacts/${name}`, data, { flag: "wx" });
            }
            if (expected.size !== 0) process.exit(4);
          '
          echo "build_run_id=$CI_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "build_run_attempt=$PINNED_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$PINNED_ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_digest=$PINNED_ARTIFACT_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Re-verify exact CI-gated Basic MCPB release asset
        run: npm run mcpb:verify
      - name: Resolve npm dist-tag from version
        id: dist_tag
        # v2.0.0-beta.2 P0 fix: resolve the complete prerelease shape instead
        # of the old suffix regex `-([a-z]+)\.[0-9]+$`, which misrouted
        # several valid SemVer prereleases to `latest`:
        #   - `2.0.0-rc` (no .N suffix)        → previously latest, now `rc`
        #   - `2.0.0-rc.0+build.1` (build meta) → previously latest, now `rc`
        #   - `2.0.0-alpha-3` (dash separator)  → previously latest, now `alpha-3`
        # v3.11.7-rc.8: import the audit gate's strict resolver so exception
        # policy and routing cannot disagree. Stable releases publish under
        # `latest`; a prerelease identifier named `latest` fails closed.
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CHANNEL=$(node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { releaseChannelForVersion } from './scripts/check-audit.mjs';
            const v = JSON.parse(readFileSync('./package.json', 'utf8')).version;
            console.log(releaseChannelForVersion(v));
          ")
          echo "tag=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION under dist-tag '$CHANNEL'"
      - name: Prepare deterministic Basic release records
        env:
          BUILD_CI_RUN_ID: ${{ steps.mcpb_candidate.outputs.build_run_id }}
          BUILD_RUN_ATTEMPT: ${{ steps.mcpb_candidate.outputs.build_run_attempt }}
          BUILD_ARTIFACT_ID: ${{ steps.mcpb_candidate.outputs.artifact_id }}
          BUILD_ARTIFACT_DIGEST: ${{ steps.mcpb_candidate.outputs.artifact_digest }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          node scripts/check-release-integrity.mjs asset-version "$VERSION"
          TAG="v$VERSION"
          ASSET="artifacts/enquire-mcp-basic-$VERSION.mcpb"
          CONTENT="artifacts/enquire-mcp-basic-$VERSION.content-manifest.json"
          SBOM="artifacts/enquire-mcp-basic-$VERSION.sbom.cdx.json"
          LICENSES="artifacts/enquire-mcp-basic-$VERSION.third-party-licenses.json"
          SOURCE_SHA=$(git rev-parse HEAD)
          SHA256=$(sha256sum "$ASSET" | awk '{print $1}')
          CONTENT_SHA256=$(sha256sum "$CONTENT" | awk '{print $1}')
          SBOM_SHA256=$(sha256sum "$SBOM" | awk '{print $1}')
          LICENSES_SHA256=$(sha256sum "$LICENSES" | awk '{print $1}')
          printf '%s  %s\n' "$SHA256" "$(basename "$ASSET")" > "$ASSET.sha256"
          ASSET="$ASSET" CONTENT="$CONTENT" SBOM="$SBOM" LICENSES="$LICENSES" TAG="$TAG" \
            SHA256="$SHA256" CONTENT_SHA256="$CONTENT_SHA256" SBOM_SHA256="$SBOM_SHA256" \
            LICENSES_SHA256="$LICENSES_SHA256" SOURCE_SHA="$SOURCE_SHA" node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const output = `${process.env.ASSET}.provenance.json`;
            const provenance = {
              artifact: process.env.ASSET.split("/").at(-1),
              sha256: process.env.SHA256,
              checksum: `${process.env.ASSET.split("/").at(-1)}.sha256`,
              content_manifest: process.env.CONTENT.split("/").at(-1),
              content_manifest_sha256: process.env.CONTENT_SHA256,
              sbom: process.env.SBOM.split("/").at(-1),
              sbom_sha256: process.env.SBOM_SHA256,
              third_party_licenses: process.env.LICENSES.split("/").at(-1),
              third_party_licenses_sha256: process.env.LICENSES_SHA256,
              source_sha: process.env.SOURCE_SHA,
              build_workflow_run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.BUILD_CI_RUN_ID}`,
              build_run_attempt: Number(process.env.BUILD_RUN_ATTEMPT),
              build_artifact_id: process.env.BUILD_ARTIFACT_ID,
              build_artifact_digest: process.env.BUILD_ARTIFACT_DIGEST,
              release: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/releases/tag/${process.env.TAG}`,
              mcpb_spec_commit: "70fe3b34cd6dff1b3bba046638edc72a6467a4fb",
              packer: "@anthropic-ai/mcpb@2.1.2",
              reproducibility: "deterministic content inventory; archive bytes contain pack-time mtime"
            };
            writeFileSync(output, `${JSON.stringify(provenance, null, 2)}\n`);
          '
      - name: Preflight existing GitHub release and every Basic asset before npm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GH_BIN=$(type -P gh)
          TIMEOUT_BIN=$(type -P timeout)
          gh_read() {
            if [ "${1:-}" != "api" ]; then
              echo "::error::gh_read accepts read-only gh api calls" >&2
              return 2
            fi
            local argument
            for argument in "$@"; do
              case "$argument" in
                graphql|--method|--method=*|-X*|--input|--input=*|-f*|-F*|--field|--field=*|--raw-field|--raw-field=*)
                  echo "::error::gh_read rejects mutation-capable gh api arguments" >&2
                  return 2
                  ;;
              esac
            done
            if ! [[ "${RELEASE_JOB_DEADLINE_EPOCH:-}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Global release deadline is missing or malformed" >&2
              return 2
            fi
            local remaining=$((RELEASE_JOB_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -le 10 ]; then
              echo "::error::Global 230-minute release deadline reached during a GitHub read" >&2
              return 124
            fi
            local limit=20
            if [ "$limit" -gt $((remaining - 10)) ]; then limit=$((remaining - 10)); fi
            "$TIMEOUT_BIN" --kill-after=5s "${limit}s" "$GH_BIN" "$@"
          }
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          SOURCE_SHA=$(git rev-parse HEAD)
          EXPECTED_PRERELEASE=false
          if [ "${{ steps.dist_tag.outputs.tag }}" != "latest" ]; then
            EXPECTED_PRERELEASE=true
          fi
          ASSET="artifacts/enquire-mcp-basic-$VERSION.mcpb"
          CONTENT="artifacts/enquire-mcp-basic-$VERSION.content-manifest.json"
          SBOM="artifacts/enquire-mcp-basic-$VERSION.sbom.cdx.json"
          LICENSES="artifacts/enquire-mcp-basic-$VERSION.third-party-licenses.json"
          release_state() {
            node scripts/check-release-integrity.mjs release-state "$TAG" "$EXPECTED_PRERELEASE" \
              "$(basename "$ASSET")" "$(basename "$ASSET.sha256")" "$(basename "$CONTENT")" \
              "$(basename "$SBOM")" "$(basename "$LICENSES")" "$(basename "$ASSET.provenance.json")"
          }
          assert_remote_tag_identity() {
            REMOTE_TAGS=$("$TIMEOUT_BIN" --kill-after=10s 60s git ls-remote --tags origin \
              "refs/tags/$TAG" "refs/tags/$TAG^{}")
            RAW_TAG_COUNT=$(printf '%s\n' "$REMOTE_TAGS" | awk -v ref="refs/tags/$TAG" \
              '$2 == ref { count++ } END { print count+0 }')
            PEELED_TAG_COUNT=$(printf '%s\n' "$REMOTE_TAGS" | awk -v ref="refs/tags/$TAG^{}" \
              '$2 == ref { count++ } END { print count+0 }')
            PEELED_TAG_SHA=$(printf '%s\n' "$REMOTE_TAGS" | awk -v ref="refs/tags/$TAG^{}" '$2 == ref { print $1 }')
            if [ "$RAW_TAG_COUNT" -ne 1 ] || [ "$PEELED_TAG_COUNT" -ne 1 ] || \
               [ "$PEELED_TAG_SHA" != "$SOURCE_SHA" ]; then
              echo "::error::Remote tag $TAG must be one annotated tag peeling to exact source SHA $SOURCE_SHA"
              exit 1
            fi
          }
          assert_stable_github_advance() {
            if [ "${{ steps.dist_tag.outputs.tag }}" != "latest" ]; then return; fi
            CURRENT_LATEST_VERSION="-"
            if LATEST_RELEASE=$(gh_read api "repos/${{ github.repository }}/releases/latest" 2>&1); then
              CURRENT_LATEST_TAG=$(printf '%s' "$LATEST_RELEASE" | jq -r '.tag_name // empty')
              if ! [[ "$CURRENT_LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::error::GitHub latest release does not have a strict stable vX.Y.Z tag"
                exit 1
              fi
              CURRENT_LATEST_VERSION=${CURRENT_LATEST_TAG#v}
            elif ! printf '%s' "$LATEST_RELEASE" | grep -Eq 'HTTP 404|Not Found'; then
              echo "::error::GitHub latest-release lookup failed without an authoritative not-found response"
              exit 1
            fi
            node scripts/check-release-integrity.mjs channel-advance \
              "$VERSION" "$CURRENT_LATEST_VERSION" "${{ steps.dist_tag.outputs.tag }}"
          }
          for LOCAL_ASSET in "$ASSET" "$ASSET.sha256" "$CONTENT" "$SBOM" "$LICENSES" "$ASSET.provenance.json"; do
            if [ ! -f "$LOCAL_ASSET" ] || [ -L "$LOCAL_ASSET" ]; then
              echo "::error::Preflight asset is missing, non-regular, or a symlink: $LOCAL_ASSET"
              exit 1
            fi
          done
          assert_remote_tag_identity
          PREFLIGHT_DIR=".mcpb-release-preflight-$GITHUB_RUN_ID"
          if [ -e "$PREFLIGHT_DIR" ]; then
            echo "::error::Release preflight identity path already exists: $PREFLIGHT_DIR"
            exit 1
          fi
          mkdir "$PREFLIGHT_DIR"
          # Only six separately successful and strictly decoded zero results
          # make an eventually consistent Releases collection authoritative.
          # Failed reads consume the bounded attempt budget but never count as
          # absence; a visible exact release wins immediately.
          RELEASE_COUNT=0
          RELEASE_ABSENCE_OBSERVATIONS=0
          for (( release_preflight_attempt=1; release_preflight_attempt<=12; release_preflight_attempt++ )); do
            if ! RELEASE_PAGES=$(gh_read api --paginate --slurp \
              "repos/${{ github.repository }}/releases?per_page=100"); then
              if [ "$release_preflight_attempt" -eq 12 ]; then
                echo "::error::GitHub release preflight remained unreadable after 12 bounded checks"
                exit 1
              fi
              echo "::warning::GitHub release preflight read failed (attempt $release_preflight_attempt/12); retrying in 5s"
              sleep 5
              continue
            fi
            RELEASES=$(printf '%s' "$RELEASE_PAGES" | node scripts/check-release-integrity.mjs \
              flatten-pages release)
            RELEASE_COUNT=$(printf '%s' "$RELEASES" | jq --arg tag "$TAG" \
              '[.[] | select(.tag_name == $tag)] | length')
            if [ "$RELEASE_COUNT" -gt 1 ]; then
              echo "::error::GitHub returned duplicate draft/published releases for $TAG"
              exit 1
            fi
            if [ "$RELEASE_COUNT" -eq 1 ]; then break; fi
            RELEASE_ABSENCE_OBSERVATIONS=$((RELEASE_ABSENCE_OBSERVATIONS + 1))
            if [ "$RELEASE_ABSENCE_OBSERVATIONS" -eq 6 ]; then break; fi
            if [ "$release_preflight_attempt" -eq 12 ]; then
              echo "::error::GitHub release absence did not reach six authoritative observations"
              exit 1
            fi
            echo "::warning::Release $TAG is absent before npm ($RELEASE_ABSENCE_OBSERVATIONS/6 confirmations); retrying in 5s"
            sleep 5
          done
          if [ "$RELEASE_COUNT" -eq 0 ]; then
            if [ "$RELEASE_ABSENCE_OBSERVATIONS" -ne 6 ]; then
              echo "::error::GitHub release absence was not confirmed before npm publication"
              exit 1
            fi
            RELEASE_ACTION=$(printf '%s' '{"release":null,"assets":[]}' | release_state | jq -r '.action')
            if [ "$RELEASE_ACTION" != "create_draft" ]; then exit 1; fi
            assert_stable_github_advance
            echo "No existing GitHub release; validated post-npm draft creation path"
            exit 0
          fi
          RELEASE_JSON=$(printf '%s' "$RELEASES" | jq --arg tag "$TAG" \
            '.[] | select(.tag_name == $tag)')
          RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -er \
            '.id | select(type == "number" and . > 0 and floor == . and . <= 9007199254740991)')
          RELEASE_PRERELEASE=$(printf '%s' "$RELEASE_JSON" | jq -r '.prerelease')
          RELEASE_DRAFT=$(printf '%s' "$RELEASE_JSON" | jq -r '.draft')
          if [ "$RELEASE_PRERELEASE" != "$EXPECTED_PRERELEASE" ] || \
             { [ "$RELEASE_DRAFT" != "true" ] && [ "$RELEASE_DRAFT" != "false" ]; }; then
            echo "::error::Existing GitHub release identity differs before npm publication"
            exit 1
          fi
          ASSET_PAGES=$(gh_read api --paginate --slurp \
            "repos/${{ github.repository }}/releases/$RELEASE_ID/assets?per_page=100")
          REMOTE_ASSETS=$(printf '%s' "$ASSET_PAGES" | node scripts/check-release-integrity.mjs \
            flatten-pages asset)
          RELEASE_STATE=$(jq -n --argjson release "$RELEASE_JSON" --argjson assets "$REMOTE_ASSETS" \
            '{release: $release, assets: $assets}')
          RELEASE_ACTION=$(printf '%s' "$RELEASE_STATE" | release_state | jq -r '.action')
          if [ "$RELEASE_ACTION" != "resume_draft" ] && [ "$RELEASE_ACTION" != "publish_draft" ] && \
             [ "$RELEASE_ACTION" != "reuse_published" ]; then
            echo "::error::Unexpected preflight release classifier action: $RELEASE_ACTION"
            exit 1
          fi
          if [ "$RELEASE_ACTION" = "reuse_published" ] && \
             [ "${{ steps.dist_tag.outputs.tag }}" = "latest" ]; then
            LATEST_TAG=$(gh_read api "repos/${{ github.repository }}/releases/latest" --jq '.tag_name')
            if [ "$LATEST_TAG" != "$TAG" ]; then
              echo "::error::Existing stable release $TAG is not GitHub's latest release before npm publication"
              exit 1
            fi
          fi
          if [ "$RELEASE_ACTION" = "resume_draft" ] || [ "$RELEASE_ACTION" = "publish_draft" ]; then
            assert_stable_github_advance
          fi
          ACTUAL_COUNT=$(printf '%s' "$REMOTE_ASSETS" | jq 'length')
          while IFS= read -r REMOTE_NAME; do
            if [ "$REMOTE_NAME" != "$(basename "$ASSET")" ] && \
               [ "$REMOTE_NAME" != "$(basename "$ASSET.sha256")" ] && \
               [ "$REMOTE_NAME" != "$(basename "$CONTENT")" ] && \
               [ "$REMOTE_NAME" != "$(basename "$SBOM")" ] && \
               [ "$REMOTE_NAME" != "$(basename "$LICENSES")" ] && \
               [ "$REMOTE_NAME" != "$(basename "$ASSET.provenance.json")" ]; then
              echo "::error::Existing release contains unexpected preflight asset $REMOTE_NAME"
              exit 1
            fi
          done < <(printf '%s' "$REMOTE_ASSETS" | jq -r '.[].name')
          if [ "$RELEASE_DRAFT" = "false" ] && [ "$ACTUAL_COUNT" -ne 6 ]; then
            echo "::error::Published release is partial before npm publication"
            exit 1
          fi
          for LOCAL_ASSET in "$ASSET" "$ASSET.sha256" "$CONTENT" "$SBOM" "$LICENSES" "$ASSET.provenance.json"; do
            NAME=$(basename "$LOCAL_ASSET")
            MATCH_COUNT=$(printf '%s' "$REMOTE_ASSETS" | jq --arg name "$NAME" \
              '[.[] | select(.name == $name)] | length')
            if [ "$MATCH_COUNT" -gt 1 ]; then
              echo "::error::Existing release contains duplicate preflight asset $NAME"
              exit 1
            fi
            if [ "$MATCH_COUNT" -eq 0 ]; then
              if [ "$RELEASE_DRAFT" = "false" ]; then
                echo "::error::Published release is missing preflight asset $NAME"
                exit 1
              fi
              continue
            fi
            REMOTE_ID=$(printf '%s' "$REMOTE_ASSETS" | jq -r --arg name "$NAME" \
              '.[] | select(.name == $name) | .id')
            gh_read api -H "Accept: application/octet-stream" \
              "repos/${{ github.repository }}/releases/assets/$REMOTE_ID" > "$PREFLIGHT_DIR/$NAME"
            if ! cmp -s "$LOCAL_ASSET" "$PREFLIGHT_DIR/$NAME"; then
              echo "::error::Existing release asset $NAME differs before npm publication"
              exit 1
            fi
          done
      - name: Publish with provenance or verify an exact prior publication
        run: |
          set -euo pipefail
          PACKAGE_NAME="@oomkapwn/enquire-mcp"
          PACKAGE_URL="https://registry.npmjs.org/%40oomkapwn%2Fenquire-mcp"
          VERSION=$(node -p "require('./package.json').version")
          SOURCE_SHA=$(git rev-parse HEAD)
          TAG="v$VERSION"
          CHANNEL="${{ steps.dist_tag.outputs.tag }}"
          EXPECTED_CHANNEL_VERSION="$VERSION"
          EXPECTED_POST_ACTION="reuse"
          NPM_PUBLISH_ATTEMPTED=false
          NPM_PUBLISH_EXIT=0
          CURL_BIN=$(type -P curl)
          NODE_BIN=$(type -P node)
          NPM_BIN=$(type -P npm)
          TAR_BIN=$(type -P tar)
          TIMEOUT_BIN=$(type -P timeout)
          PACKUMENT=$(mktemp "$RUNNER_TEMP/enquire-npm-packument.XXXXXX")
          if [ ! -f "$PACKUMENT" ] || [ -L "$PACKUMENT" ]; then
            echo "::error::npm packument scratch file is missing, non-regular, or a symlink"
            exit 1
          fi
          registry_read() {
            local status request_exit
            set +e
            status=$("$TIMEOUT_BIN" --kill-after=5s 35s "$CURL_BIN" \
              --silent --show-error --connect-timeout 10 --max-time 30 --max-filesize 67108864 --retry 0 \
              --proto '=https' --tlsv1.2 \
              --header "Accept: application/json" --header "Cache-Control: no-cache" \
              --output "$PACKUMENT" --write-out '%{http_code}' "$PACKAGE_URL")
            request_exit=$?
            set -e
            if [ "$request_exit" -ne 0 ] || [ "$status" != "200" ] || \
               [ ! -s "$PACKUMENT" ] || [ -L "$PACKUMENT" ]; then
              echo "::warning::npm packument read was not one bounded HTTP 200 (exit=$request_exit status=$status)" >&2
              return 1
            fi
            return 0
          }
          npm_snapshot() {
            jq -ce --arg package "$PACKAGE_NAME" --arg version "$VERSION" --arg channel "$CHANNEL" '
              if type != "object" or .name != $package or (.versions | type) != "object" or
                 (."dist-tags" | type) != "object" then
                error("npm packument identity or collection shape is malformed")
              else
                (."dist-tags" | has($channel)) as $channelPresent
                | (if $channelPresent then ."dist-tags"[$channel] else "-" end) as $channelVersion
                | if ($channelVersion | type) != "string" or ($channelVersion | length) == 0 or
                     ($channelPresent and ($channelVersion == "-")) then
                    error("npm channel value is malformed")
                  elif (.versions | has($version)) then
                    .versions[$version] as $published
                    | if ($published | type) != "object" or $published.name != $package or
                         $published.version != $version or ($published.dist | type) != "object" then
                        error("npm version identity or dist shape is malformed")
                      else
                        {
                          exists: true,
                          gitHead: (if ($published | has("gitHead")) then $published.gitHead else null end),
                          integrity: $published.dist.integrity,
                          channelVersion: $channelVersion
                        }
                      end
                  else
                    {exists: false, channelVersion: $channelVersion}
                  end
              end
            ' "$PACKUMENT"
          }
          tarball_sri() {
            "$NODE_BIN" -e '
              const { createHash } = require("node:crypto");
              const { readFileSync } = require("node:fs");
              process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`);
            ' "$1"
          }
          require_job_reserve() {
            local required="$1"
            local label="$2"
            if ! [[ "${RELEASE_JOB_DEADLINE_EPOCH:-}" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Global release deadline is missing or malformed" >&2
              exit 1
            fi
            local remaining=$((RELEASE_JOB_DEADLINE_EPOCH - $(date +%s)))
            if [ "$remaining" -lt "$required" ]; then
              echo "::error::$label requires ${required}s of post-write reserve; only ${remaining}s remain"
              exit 1
            fi
          }
          assert_remote_tag_identity() {
            REMOTE_TAGS=$("$TIMEOUT_BIN" --kill-after=10s 60s git ls-remote --tags origin \
              "refs/tags/$TAG" "refs/tags/$TAG^{}")
            RAW_TAG_COUNT=$(printf '%s\n' "$REMOTE_TAGS" | awk -v ref="refs/tags/$TAG" \
              '$2 == ref { count++ } END { print count+0 }')
            PEELED_TAG_COUNT=$(printf '%s\n' "$REMOTE_TAGS" | awk -v ref="refs/tags/$TAG^{}" \
              '$2 == ref { count++ } END { print count+0 }')
            PEELED_TAG_SHA=$(printf '%s\n' "$REMOTE_TAGS" | awk -v ref="refs/tags/$TAG^{}" '$2 == ref { print $1 }')
            if [ "$RAW_TAG_COUNT" -ne 1 ] || [ "$PEELED_TAG_COUNT" -ne 1 ] || \
               [ "$PEELED_TAG_SHA" != "$SOURCE_SHA" ]; then
              echo "::error::Remote tag $TAG must be one annotated tag peeling to exact source SHA $SOURCE_SHA"
              exit 1
            fi
          }

          PACK_JSON=$("$TIMEOUT_BIN" --kill-after=10s 600s "$NPM_BIN" pack --json --ignore-scripts \
            --pack-destination "$RUNNER_TEMP")
          if [ "$(printf '%s' "$PACK_JSON" | jq 'if type == "array" then length else -1 end')" -ne 1 ]; then
            echo "::error::npm pack did not produce exactly one canonical tarball"
            exit 1
          fi
          PACK_NAME=$(printf '%s' "$PACK_JSON" | jq -er '.[0].name | select(type == "string" and length > 0)')
          PACK_VERSION=$(printf '%s' "$PACK_JSON" | jq -er '.[0].version | select(type == "string" and length > 0)')
          if [ "$PACK_NAME" != "$PACKAGE_NAME" ] || [ "$PACK_VERSION" != "$VERSION" ]; then
            echo "::error::npm pack returned a divergent package name or version"
            exit 1
          fi
          PACK_BASENAME=$(printf '%s' "$PACK_JSON" | jq -er \
            '.[0].filename | select(type == "string" and length > 0)')
          if [ "$(basename "$PACK_BASENAME")" != "$PACK_BASENAME" ]; then
            echo "::error::npm pack returned a non-basename artifact path"
            exit 1
          fi
          PACKAGE_TARBALL="$RUNNER_TEMP/$PACK_BASENAME"
          if [ ! -f "$PACKAGE_TARBALL" ] || [ -L "$PACKAGE_TARBALL" ]; then
            echo "::error::npm pack tarball is missing, non-regular, or a symlink"
            exit 1
          fi
          PACK_MANIFEST_COUNT=$("$TIMEOUT_BIN" --kill-after=5s 30s "$TAR_BIN" -tzf "$PACKAGE_TARBALL" | awk \
            '$0 == "package/package.json" { count++ } END { print count+0 }')
          if [ "$PACK_MANIFEST_COUNT" -ne 1 ]; then
            echo "::error::canonical npm tarball must contain exactly one package/package.json"
            exit 1
          fi
          PACK_MANIFEST=$("$TIMEOUT_BIN" --kill-after=5s 30s "$TAR_BIN" -xOf "$PACKAGE_TARBALL" \
            package/package.json)
          PACKED_NAME=$(printf '%s' "$PACK_MANIFEST" | jq -er '.name | select(type == "string" and length > 0)')
          PACKED_VERSION=$(printf '%s' "$PACK_MANIFEST" | jq -er '.version | select(type == "string" and length > 0)')
          if [ "$PACKED_NAME" != "$PACKAGE_NAME" ] || [ "$PACKED_VERSION" != "$VERSION" ]; then
            echo "::error::canonical npm tarball embeds a divergent package name or version"
            exit 1
          fi
          REPORTED_INTEGRITY=$(printf '%s' "$PACK_JSON" | jq -er \
            '.[0].integrity | select(type == "string" and test("^sha512-[A-Za-z0-9+/]{86}==$"))')
          EXPECTED_INTEGRITY=$(tarball_sri "$PACKAGE_TARBALL")
          if [ "$REPORTED_INTEGRITY" != "$EXPECTED_INTEGRITY" ]; then
            echo "::error::npm pack metadata integrity differs from the canonical tarball bytes"
            exit 1
          fi

          if ! registry_read; then
            echo "::error::npm preflight requires one authoritative, bounded full-packument HTTP 200"
            exit 1
          fi
          NPM_STATE=$(npm_snapshot)
          NPM_RESULT=$(printf '%s' "$NPM_STATE" | "$NODE_BIN" scripts/check-release-integrity.mjs \
            npm-state "$SOURCE_SHA" "$EXPECTED_INTEGRITY" "$VERSION" "$CHANNEL")
          NPM_ACTION=$(printf '%s' "$NPM_RESULT" | jq -er '.action')
          PUBLISHED_CHANNEL_VERSION=$(printf '%s' "$NPM_STATE" | jq -er '.channelVersion')
          if [ "$NPM_ACTION" = "reuse_superseded" ]; then
            EXPECTED_CHANNEL_VERSION="$PUBLISHED_CHANNEL_VERSION"
            EXPECTED_POST_ACTION="reuse_superseded"
            echo "npm version $VERSION has the exact tarball bytes and is superseded by $EXPECTED_CHANNEL_VERSION on @$CHANNEL"
          elif [ "$NPM_ACTION" = "reuse" ]; then
            echo "npm version $VERSION already has the exact tarball bytes — publication is complete"
          elif [ "$NPM_ACTION" = "publish" ]; then
            node scripts/check-release-integrity.mjs channel-advance \
              "$VERSION" "$PUBLISHED_CHANNEL_VERSION" "$CHANNEL"
            require_job_reserve 2100 "npm publish"
            assert_remote_tag_identity
            if ! registry_read; then
              echo "::error::npm pre-write check requires one authoritative, bounded full-packument HTTP 200"
              exit 1
            fi
            PRE_WRITE_NPM_STATE=$(npm_snapshot)
            PRE_WRITE_NPM_ACTION=$(printf '%s' "$PRE_WRITE_NPM_STATE" | "$NODE_BIN" \
              scripts/check-release-integrity.mjs \
                npm-state "$SOURCE_SHA" "$EXPECTED_INTEGRITY" "$VERSION" "$CHANNEL" | jq -er '.action')
            if [ "$PRE_WRITE_NPM_ACTION" != "publish" ]; then
              echo "::error::npm version state changed after preflight; refusing publication"
              exit 1
            fi
            PRE_WRITE_CHANNEL_VERSION=$(printf '%s' "$PRE_WRITE_NPM_STATE" | jq -er '.channelVersion')
            node scripts/check-release-integrity.mjs channel-advance \
              "$VERSION" "$PRE_WRITE_CHANNEL_VERSION" "$CHANNEL"
            PRE_PUBLISH_INTEGRITY=$(tarball_sri "$PACKAGE_TARBALL")
            if [ "$PRE_PUBLISH_INTEGRITY" != "$EXPECTED_INTEGRITY" ]; then
              echo "::error::canonical npm tarball changed after preflight and before publication"
              exit 1
            fi
            NPM_PUBLISH_ATTEMPTED=true
            set +e
            "$TIMEOUT_BIN" --kill-after=10s 600s npm publish "$PACKAGE_TARBALL" --provenance --access public --tag "$CHANNEL" --ignore-scripts
            NPM_PUBLISH_EXIT=$?
            set -e
          else
            echo "::error::npm publication evaluator returned an unknown action"
            exit 1
          fi

          CONFIRMED_CHANNEL_VERSION=""
          CONFIRMED_INTEGRITY=""
          NPM_POST_ACTION=""
          for (( attempt=1; attempt<=12; attempt++ )); do
            if registry_read && NPM_POST_STATE=$(npm_snapshot); then
              if [ "$(printf '%s' "$NPM_POST_STATE" | jq -r '.exists')" = "true" ]; then
                NPM_IDENTITY_STATE=$(printf '%s' "$NPM_POST_STATE" | jq -c \
                  --arg channelVersion "$EXPECTED_CHANNEL_VERSION" '.channelVersion = $channelVersion')
                NPM_IDENTITY_RESULT=$(printf '%s' "$NPM_IDENTITY_STATE" | "$NODE_BIN" \
                  scripts/check-release-integrity.mjs \
                    npm-state "$SOURCE_SHA" "$EXPECTED_INTEGRITY" "$VERSION" "$CHANNEL")
                NPM_IDENTITY_ACTION=$(printf '%s' "$NPM_IDENTITY_RESULT" | jq -er '.action')
                if [ "$NPM_IDENTITY_ACTION" != "$EXPECTED_POST_ACTION" ]; then
                  echo "::error::npm immutable identity converged to an unexpected publication action"
                  exit 1
                fi
                CONFIRMED_INTEGRITY=$(printf '%s' "$NPM_POST_STATE" | jq -er '.integrity')
                CONFIRMED_CHANNEL_VERSION=$(printf '%s' "$NPM_POST_STATE" | jq -er '.channelVersion')
                if [ "$CONFIRMED_CHANNEL_VERSION" = "$EXPECTED_CHANNEL_VERSION" ]; then
                  NPM_POST_ACTION="$NPM_IDENTITY_ACTION"
                  break
                fi
              fi
            fi
            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done
