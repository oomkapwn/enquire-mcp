<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b3a"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.45"/>
    </pattern>
    <linearGradient id="flowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.0"/>
      <stop offset="30%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow1)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- Accent left bar -->
  <rect x="0" y="0" width="6" height="640" fill="#8b5cf6"/>

  <!-- ============ TOP: Hero value prop ============ -->
  <g transform="translate(72, 88)">
    <!-- Eyebrow tag -->
    <text x="0" y="0" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace" font-size="16" fill="#8b5cf6" font-weight="600" letter-spacing="2">
      OPEN-SOURCE · MCP-NATIVE · VENDOR-NEUTRAL
    </text>

    <!-- BIG HEADLINE: emotional value prop -->
    <text x="0" y="84" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="74" fill="#f8fafc" font-weight="800" letter-spacing="-2.5">
      Long-term memory
    </text>
    <text x="0" y="156" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="74" fill="#f8fafc" font-weight="800" letter-spacing="-2.5">
      for <tspan fill="#06b6d4">AI agents</tspan>.
    </text>

    <!-- Subtitle: where the memory lives -->
    <text x="0" y="220" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" fill="#cbd5e1" font-weight="500">
      Built on your Obsidian vault. Your knowledge, every agent, every session.
    </text>
  </g>

  <!-- ============ MIDDLE: Visual flow vault → memory → agents ============ -->
  <g transform="translate(72, 370)">
    <!-- LEFT: Obsidian vault stack -->
    <g transform="translate(0, 0)">
      <!-- Stacked markdown files visual -->
      <rect x="0" y="20" width="120" height="78" rx="6" fill="#1e1b3a" stroke="#475569" stroke-width="1"/>
      <rect x="6" y="14" width="120" height="78" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
      <rect x="12" y="8" width="120" height="78" rx="6" fill="#312e81" stroke="#8b5cf6" stroke-width="1.5"/>
      <!-- File icon on top card -->
      <text x="24" y="36" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#a78bfa" font-weight="700">#research</text>
      <line x1="24" y1="46" x2="116" y2="46" stroke="#475569" stroke-width="1"/>
      <line x1="24" y1="56" x2="100" y2="56" stroke="#475569" stroke-width="1"/>
      <line x1="24" y1="66" x2="116" y2="66" stroke="#475569" stroke-width="1"/>
      <line x1="24" y1="76" x2="78" y2="76" stroke="#475569" stroke-width="1"/>
      <!-- Label -->
      <text x="66" y="128" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="middle">Your vault</text>
      <text x="66" y="148" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace" font-size="11" fill="#64748b" text-anchor="middle">.md files you own</text>
    </g>

    <!-- Flow arrow + memory layer -->
    <g transform="translate(165, 35)">
      <!-- Arrow line -->
      <line x1="0" y1="20" x2="100" y2="20" stroke="url(#flowLine)" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="95,15 105,20 95,25" fill="#8b5cf6" opacity="0.8"/>
      <!-- Memory chip icon -->
      <rect x="115" y="0" width="90" height="40" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
      <text x="160" y="25" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#06b6d4" font-weight="700" text-anchor="middle">enquire-mcp</text>
      <text x="160" y="58" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace" font-size="10" fill="#64748b" text-anchor="middle">indexes · semantic search</text>
      <!-- Arrow out -->
      <line x1="210" y1="20" x2="310" y2="20" stroke="url(#flowLine)" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="305,15 315,20 305,25" fill="#06b6d4" opacity="0.8"/>
    </g>

    <!-- RIGHT: AI agent badges (5 in a row) -->
    <g transform="translate(490, 0)">
      <!-- Agent 1: Claude -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="100" height="100" rx="10" fill="#1e293b" stroke="#cbd5e1" stroke-width="1"/>
        <text x="50" y="40" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Claude</text>
        <text x="50" y="58" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Code · Desktop</text>
        <circle cx="50" cy="78" r="6" fill="#c97f4a"/>
      </g>
      <!-- Agent 2: Cursor -->
      <g transform="translate(112, 0)">
        <rect x="0" y="0" width="100" height="100" rx="10" fill="#1e293b" stroke="#cbd5e1" stroke-width="1"/>
        <text x="50" y="40" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Cursor</text>
        <text x="50" y="58" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">IDE</text>
        <rect x="42" y="72" width="16" height="12" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
      </g>
      <!-- Agent 3: ChatGPT -->
      <g transform="translate(224, 0)">
        <rect x="0" y="0" width="100" height="100" rx="10" fill="#1e293b" stroke="#cbd5e1" stroke-width="1"/>
        <text x="50" y="40" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">ChatGPT</text>
        <text x="50" y="58" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">custom GPT</text>
        <circle cx="50" cy="78" r="6" fill="#10a37f"/>
      </g>
      <!-- Agent 4: Codex -->
      <g transform="translate(336, 0)">
        <rect x="0" y="0" width="100" height="100" rx="10" fill="#1e293b" stroke="#cbd5e1" stroke-width="1"/>
        <text x="50" y="40" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc" text-anchor="middle">Codex</text>
        <text x="50" y="58" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">+ any MCP</text>
        <text x="50" y="84" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">⌗</text>
      </g>
      <!-- Agent 5: Generic MCP -->
      <g transform="translate(448, 0)">
        <rect x="0" y="0" width="100" height="100" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,3"/>
        <text x="50" y="40" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#a78bfa" text-anchor="middle">+ more</text>
        <text x="50" y="58" font-family="ui-monospace, monospace" font-size="9" fill="#94a3b8" text-anchor="middle">any MCP client</text>
        <text x="50" y="84" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#a78bfa" text-anchor="middle">…</text>
      </g>
    </g>
  </g>

  <!-- ============ BOTTOM: Trust signals + CTA ============ -->
  <g transform="translate(72, 560)">
    <!-- Trust signals row -->
    <text x="0" y="0" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace" font-size="13" letter-spacing="0.5">
      <tspan font-weight="700" fill="#10b981">MIT</tspan>
      <tspan fill="#475569">  ·  </tspan>
      <tspan font-weight="700" fill="#10b981">SLSA-3</tspan>
      <tspan fill="#475569">  ·  </tspan>
      <tspan fill="#cbd5e1">Hybrid retrieval</tspan>
      <tspan fill="#475569">  ·  </tspan>
      <tspan fill="#cbd5e1">BGE reranker</tspan>
      <tspan fill="#475569">  ·  </tspan>
      <tspan fill="#cbd5e1">HNSW</tspan>
      <tspan fill="#475569">  ·  </tspan>
      <tspan fill="#cbd5e1">PDFs + OCR</tspan>
      <tspan fill="#475569">  ·  </tspan>
      <tspan fill="#cbd5e1">50+ languages</tspan>
      <tspan fill="#475569">  ·  </tspan>
      <tspan fill="#cbd5e1">Zero cloud calls</tspan>
    </text>
    <!-- Install command -->
    <text x="0" y="32" font-family="ui-monospace, 'SF Mono', Menlo, Monaco, monospace" font-size="14">
      <tspan fill="#64748b">$ </tspan>
      <tspan fill="#06b6d4" font-weight="600">npm install -g @oomkapwn/enquire-mcp</tspan>
      <tspan fill="#475569">   ·   </tspan>
      <tspan fill="#94a3b8">github.com/oomkapwn/enquire-mcp</tspan>
    </text>
  </g>
</svg>
