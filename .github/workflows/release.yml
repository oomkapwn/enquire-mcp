      # OIDC identity for the `io.github.oomkapwn/*` namespace).
      #
      # STABLE-ONLY: the registry's `isLatest` should reflect what users get
      # from `npm install @oomkapwn/enquire-mcp` (the `latest` dist-tag), NOT a
      # prerelease — otherwise the canonical listing (which Glama / mcp.so /
      # smithery auto-sync from) would advertise an `-rc.N` as current. RC tags
      # publish to npm under `@rc` but are SKIPPED here. This closes the
      # registry-drift class: pre-3.9.0-rc.32 the registry was published
      # manually (`mcp-publisher publish` after each stable), and it silently
      # fell ~7 versions behind (stuck at 3.8.4 while npm was at 3.8.8).
      - name: Publish to MCP Registry (stable only)
        if: steps.dist_tag.outputs.tag == 'latest'
        run: |
          set -euo pipefail
          # server.json is version-pinned by check-version-consistency.mjs to
          # match package.json, so on a stable run it already carries the
          # just-published stable version. Re-sync defensively in case the tag
          # was cut from a tree where server.json lagged.
          VERSION=$(node -p "require('./package.json').version")
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('server.json','utf8'));s.version='${VERSION}';if(s.packages)for(const p of s.packages)p.version='${VERSION}';fs.writeFileSync('server.json',JSON.stringify(s,null,2)+'\n')"
          # Download the official publisher CLI. v3.9.0-rc.33 (external-audit
          # M-9): PINNED to an exact release tag (not `releases/latest`) so a
          # re-tagged/compromised upstream "latest" can't silently change the
          # binary that runs with our OIDC identity in the publish path.
          # v3.10.0-rc.26 (SYS-1 / M-9 completion): CONTENT-pin too — a tag can be
          # force-moved (delete+recreate) or a release asset re-uploaded, so verify
          # the tarball's SHA256 before it runs. `ubuntu-latest` is linux/amd64;
          # bump MCP_PUBLISHER_SHA256 *together with* MCP_PUBLISHER_TAG (deliberate;
          # get the hash from `curl -fsSL <url> | sha256sum`). `sha256sum -c` exits
          # non-zero on mismatch → the step fails closed, aborting the publish.
          MCP_PUBLISHER_TAG="v1.7.9"
          MCP_PUBLISHER_SHA256="ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_TAG}/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
          echo "Published $VERSION to the MCP Registry"
