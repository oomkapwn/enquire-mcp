name: Candidate release identity capture

on:
  push:
    branches:
      - codex/release-rc3-tag-only-20260810

permissions:
  contents: read

concurrency:
  group: candidate-release-identity-capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Restore the frozen release-matrix source oracle
        run: |
          git show \
            8420e2fca3ed0dac994859a9e9a30b933d5ddf9e:tests/release-integrity.test.ts \
            > tests/release-integrity.test.ts
      - name: Capture the candidate external-source identity projection
        run: |
          node scripts/generate-release-mutation-identity.mjs \
            > tests/fixtures/release-mutation-identity.v2.json
      - name: Export the candidate identity fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-release-mutation-identity
          path: tests/fixtures/release-mutation-identity.v2.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
