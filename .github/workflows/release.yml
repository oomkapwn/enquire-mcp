          if [ "$NPM_PUBLISH_ATTEMPTED" = "true" ] && [ "$NPM_PUBLISH_EXIT" -ne 0 ]; then
            echo "::warning::npm publish exited $NPM_PUBLISH_EXIT, but exact tarball SRI, channel, and tag postconditions prove publication completed"
          fi
        env:
